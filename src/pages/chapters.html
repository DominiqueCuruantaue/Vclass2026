<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulos - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .trimester-tab { transition: all 0.3s ease; }
        .trimester-tab.active {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(109,40,217,0.25);
        }
        .chapter-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
        }
        .lesson-item { transition: all 0.2s ease; }
        .lesson-item:hover { background-color: #faf5ff; }
        .progress-ring { transform: rotate(-90deg); }
        .trimester-roman {
            display: inline-flex; align-items: center; justify-content: center;
            width: 2rem; height: 2rem; border-radius: 50%;
            font-weight: 800; font-size: 0.8rem;
        }
        .chapter-header-gradient { background: linear-gradient(135deg, var(--ch-color-start), var(--ch-color-end)); }
        .expand-btn { transition: transform 0.3s; }
        .expand-btn.open { transform: rotate(180deg); }
        .lessons-panel { transition: max-height 0.4s ease, opacity 0.3s; overflow: hidden; }
        .lessons-panel.collapsed { max-height: 0; opacity: 0; }
        .lessons-panel.expanded { max-height: 1000px; opacity: 1; }
        /* is_free removido — política da plataforma */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
                    background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-6">
                    <a href="/dashboard.html" class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </a>
                    <div class="hidden md:flex space-x-1">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-lg text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-book mr-1"></i> Conteúdo
                        </a>
                        <a href="/progress.html" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/notifications.html" class="relative p-2 text-gray-500 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition">
                        <i class="fas fa-bell text-lg"></i>
                    </a>
                    <div class="flex items-center space-x-2 px-2 py-1 rounded-lg bg-gray-50">
                        <div id="nav-avatar" class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white text-xs font-bold">?</div>
                        <span id="nav-user-name" class="hidden md:block text-sm font-medium text-gray-700"></span>
                    </div>
                    <button onclick="VClass.logout()" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition" title="Sair">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-5xl">

        <!-- Breadcrumb -->
        <nav class="flex mb-6" aria-label="Breadcrumb">
            <ol id="breadcrumb" class="inline-flex items-center flex-wrap gap-1 text-sm text-gray-500">
                <li><a href="/browse.html" class="hover:text-purple-600 transition flex items-center gap-1"><i class="fas fa-compass text-xs"></i> Explorar</a></li>
                <li class="flex items-center gap-1"><i class="fas fa-chevron-right text-xs text-gray-300"></i><span id="bc-country" class="text-gray-500">País</span></li>
                <li class="flex items-center gap-1"><i class="fas fa-chevron-right text-xs text-gray-300"></i><span id="bc-grade" class="text-gray-500">Classe</span></li>
                <li class="flex items-center gap-1"><i class="fas fa-chevron-right text-xs text-gray-300"></i><span id="bc-subject" class="font-semibold text-purple-700">Disciplina</span></li>
            </ol>
        </nav>

        <!-- Subject Header -->
        <div id="subject-header" class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <!-- Loading skeleton -->
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl skeleton"></div>
                <div class="flex-1 space-y-2">
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                </div>
            </div>
        </div>

        <!-- Trimester Tabs -->
        <div class="bg-white rounded-2xl shadow-sm p-2 mb-6 border border-gray-100">
            <div class="flex flex-wrap gap-2">
                <button onclick="showTrimester('all', this)" id="tab-all"
                    class="trimester-tab active flex-1 min-w-[100px] px-4 py-2.5 rounded-xl font-semibold text-sm">
                    <i class="fas fa-th-large mr-1.5"></i>Todos
                </button>
                <button onclick="showTrimester(1, this)" id="tab-1"
                    class="trimester-tab flex-1 min-w-[100px] px-4 py-2.5 rounded-xl font-semibold text-sm text-gray-600">
                    <span class="trimester-roman bg-blue-100 text-blue-700 mr-1.5 text-xs">I</span>1º Trimestre
                </button>
                <button onclick="showTrimester(2, this)" id="tab-2"
                    class="trimester-tab flex-1 min-w-[100px] px-4 py-2.5 rounded-xl font-semibold text-sm text-gray-600">
                    <span class="trimester-roman bg-emerald-100 text-emerald-700 mr-1.5 text-xs">II</span>2º Trimestre
                </button>
                <button onclick="showTrimester(3, this)" id="tab-3"
                    class="trimester-tab flex-1 min-w-[100px] px-4 py-2.5 rounded-xl font-semibold text-sm text-gray-600">
                    <span class="trimester-roman bg-orange-100 text-orange-700 mr-1.5 text-xs">III</span>3º Trimestre
                </button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div id="stats-bar" class="grid grid-cols-3 gap-3 mb-6 hidden">
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <p class="text-2xl font-bold text-purple-700" id="stat-chapters">-</p>
                <p class="text-xs text-gray-500 mt-0.5">Capítulos</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <p class="text-2xl font-bold text-blue-600" id="stat-lessons">-</p>
                <p class="text-xs text-gray-500 mt-0.5">Lições</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <p class="text-2xl font-bold text-green-600" id="stat-progress">0%</p>
                <p class="text-xs text-gray-500 mt-0.5">Concluído</p>
            </div>
        </div>

        <!-- Chapters Container -->
        <div id="chapters-container" class="space-y-4">
            <!-- Skeletons -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="p-5 space-y-3">
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-2/3"></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="p-5 space-y-3">
                    <div class="h-6 skeleton rounded w-1/2"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="p-5 space-y-3">
                    <div class="h-6 skeleton rounded w-2/5"></div>
                    <div class="h-4 skeleton rounded w-3/5"></div>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="mt-8">
            <a href="/browse.html" class="inline-flex items-center px-5 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:border-purple-300 hover:text-purple-700 transition shadow-sm font-medium text-sm gap-2">
                <i class="fas fa-arrow-left text-xs"></i> Voltar para Explorar
            </a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // ── Auth ──────────────────────────────────────────────────────────
        if (!VClass.isAuthenticated()) window.location.href = '/login.html';
        const user = VClass.getCurrentUser();
        if (user) {
            const name = user.full_name || user.name || 'Estudante';
            const initials = name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
            document.getElementById('nav-avatar').textContent = initials;
            document.getElementById('nav-user-name').textContent = name.split(' ')[0];
        }

        // ── URL params ────────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        // Support both old (gs=, subject=, grade=) and new (country=, gradeId=, subjectId=) params
        const countryCode  = params.get('country') || 'ao';
        const gradeId      = params.get('gradeId')  || params.get('grade') || '';
        const subjectId    = params.get('subjectId') || params.get('gs')   || '';
        const subjectName  = params.get('subject')  || '';
        const gradeName    = params.get('gradeName') || '';

        if (!countryCode) { window.location.href = '/browse.html'; }

        // Update breadcrumb placeholders
        document.getElementById('bc-country').textContent = countryCode.toUpperCase();
        document.getElementById('bc-grade').textContent   = gradeName || gradeId;
        document.getElementById('bc-subject').textContent = subjectName || subjectId;

        // ── State ─────────────────────────────────────────────────────────
        let allChapters = [];
        let subjectMeta = {};
        let currentFilter = 'all';

        // ── Trimester filter ──────────────────────────────────────────────
        function showTrimester(val, btn) {
            currentFilter = val;
            document.querySelectorAll('.trimester-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const filtered = val === 'all'
                ? allChapters
                : allChapters.filter(ch => ch.term === val || ch.trimester === val);
            renderChapters(filtered);
        }

        // ── Chapter expand/collapse ───────────────────────────────────────
        function toggleChapter(id) {
            const panel = document.getElementById(`lessons-${id}`);
            const btn   = document.getElementById(`expand-${id}`);
            if (!panel) return;
            const isOpen = panel.classList.contains('expanded');
            panel.classList.toggle('expanded', !isOpen);
            panel.classList.toggle('collapsed', isOpen);
            btn.classList.toggle('open', !isOpen);
        }

        // ── Render subject header ─────────────────────────────────────────
        function renderSubjectHeader(meta, chapters) {
            const totalLessons = chapters.reduce((s, ch) => s + (ch.lesson_count || ch.lessons?.length || 0), 0);
            document.getElementById('subject-header').innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-sm"
                             style="background:${meta.color || '#7c3aed'}22">
                            <i class="fas ${meta.icon || 'fa-book'} text-2xl" style="color:${meta.color || '#7c3aed'}"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">${meta.name || subjectName}</h1>
                            <p class="text-sm text-gray-500 mt-0.5">${gradeName || gradeId} &bull; ${countryCode.toUpperCase()}
                                &bull; <span class="font-medium text-gray-700">${chapters.length} capítulos</span>
                                &bull; <span class="font-medium text-gray-700">${totalLessons} lições</span>
                            </p>
                        </div>
                    </div>
                    <!-- Progress ring -->
                    <div class="flex items-center gap-3 sm:flex-col sm:items-center sm:gap-1">
                        <div class="relative w-16 h-16">
                            <svg class="w-16 h-16">
                                <circle stroke-width="5" stroke="#e5e7eb" fill="transparent" r="26" cx="32" cy="32"/>
                                <circle id="progress-ring" stroke-width="5" stroke-linecap="round"
                                        stroke="${meta.color || '#7c3aed'}" fill="transparent" r="26" cx="32" cy="32"
                                        class="progress-ring"
                                        style="stroke-dasharray:163.36; stroke-dashoffset:163.36;"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span id="progress-pct" class="text-xs font-bold" style="color:${meta.color || '#7c3aed'}">0%</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 text-center">Progresso</p>
                    </div>
                </div>`;
        }

        // ── Render chapters list ──────────────────────────────────────────
        const TRIMESTER_STYLE = {
            1: { badge: 'bg-blue-100 text-blue-700',   border: '#3b82f6', headerFrom: '#2563eb', headerTo: '#3b82f6', roman: 'I'   },
            2: { badge: 'bg-emerald-100 text-emerald-700', border: '#10b981', headerFrom: '#059669', headerTo: '#10b981', roman: 'II'  },
            3: { badge: 'bg-orange-100 text-orange-700', border: '#f59e0b', headerFrom: '#d97706', headerTo: '#f59e0b', roman: 'III' },
        };

        function renderChapters(chapters) {
            const container = document.getElementById('chapters-container');
            if (chapters.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center border border-gray-100">
                        <i class="fas fa-calendar-times text-5xl text-gray-200 mb-4 block"></i>
                        <h2 class="text-xl font-bold text-gray-600 mb-2">Nenhum capítulo neste trimestre</h2>
                        <p class="text-gray-400 text-sm">Selecione outro período para ver os capítulos.</p>
                    </div>`;
                return;
            }

            // Group by term
            const grouped = {};
            chapters.forEach(ch => {
                const t = ch.term || ch.trimester || 1;
                if (!grouped[t]) grouped[t] = [];
                grouped[t].push(ch);
            });

            let html = '';
            Object.keys(grouped).sort((a,b) => +a - +b).forEach(tKey => {
                const tNum = +tKey;
                const st = TRIMESTER_STYLE[tNum] || TRIMESTER_STYLE[1];
                const tChapters = grouped[tKey];
                html += `
                <div class="mb-2">
                    <div class="flex items-center gap-3 mb-3 mt-1">
                        <span class="trimester-roman ${st.badge} w-8 h-8">${st.roman}</span>
                        <h2 class="text-base font-bold text-gray-700">${tNum}º Trimestre</h2>
                        <div class="flex-1 h-px bg-gray-100"></div>
                        <span class="text-xs text-gray-400">${tChapters.length} cap.</span>
                    </div>
                    <div class="space-y-3">
                    ${tChapters.map((ch, i) => {
                        const num   = allChapters.indexOf(ch) + 1;
                        const color = subjectMeta.color || '#7c3aed';
                        const lessons = ch.lessons || [];
                        const lessonCount = ch.lesson_count || lessons.length || 0;
                        return `
                        <div class="chapter-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100"
                             style="border-left-color:${color}">
                            <!-- Chapter Header -->
                            <button onclick="toggleChapter('${ch.id}')"
                                class="w-full text-left p-5 flex items-center gap-4 hover:bg-gray-50 transition group">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm text-white font-bold text-lg"
                                     style="background: linear-gradient(135deg, ${color}cc, ${color})">
                                    ${num}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-gray-900 text-base leading-tight">${ch.title}</h3>
                                    <p class="text-sm text-gray-500 truncate mt-0.5">${ch.description || 'Unidade temática'}</p>
                                </div>
                                <div class="flex items-center gap-3 flex-shrink-0">
                                    <span class="text-xs font-semibold px-2 py-1 rounded-lg" style="background:${color}15; color:${color}">
                                        ${lessonCount} ${lessonCount === 1 ? 'lição' : 'lições'}
                                    </span>
                                    <i id="expand-${ch.id}" class="fas fa-chevron-down text-gray-300 text-sm expand-btn"></i>
                                </div>
                            </button>

                            <!-- Lessons Panel -->
                            <div id="lessons-${ch.id}" class="lessons-panel collapsed border-t border-gray-100">
                                ${lessons.length > 0 ? renderLessonsList(lessons, ch) : renderNoLessons(ch)}
                            </div>
                        </div>`;
                    }).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderLessonsList(lessons, ch) {
            return `<div class="divide-y divide-gray-50">
                ${lessons.map((l, i) => `
                <a href="/lesson.html?id=${l.id || ch.id + '-l' + (i+1)}&chapter=${encodeURIComponent(ch.title)}&subject=${encodeURIComponent(subjectMeta.name||subjectName)}&grade=${encodeURIComponent(gradeName)}&country=${encodeURIComponent(countryCode)}"
                   class="lesson-item flex items-center gap-4 px-5 py-4 group">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 bg-gray-100 group-hover:bg-purple-100 transition">
                        <i class="fas fa-play text-gray-400 group-hover:text-purple-600 text-xs transition"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center flex-wrap gap-1.5 mb-0.5">
                            <span class="text-xs font-semibold text-gray-400">Lição ${i+1}</span>
                            
                            ${l.video_duration ? `<span class="text-xs text-gray-400"><i class="fas fa-clock mr-0.5"></i>${Math.floor(l.video_duration/60)} min</span>` : ''}
                        </div>
                        <h4 class="text-sm font-semibold text-gray-800 group-hover:text-purple-700 transition truncate">${l.title || ch.title + ' — Parte ' + (i+1)}</h4>
                        ${l.description ? `<p class="text-xs text-gray-400 truncate mt-0.5">${l.description}</p>` : ''}
                    </div>
                    <i class="fas fa-chevron-right text-gray-200 group-hover:text-purple-400 text-xs flex-shrink-0 transition"></i>
                </a>`).join('')}
            </div>`;
        }

        function renderNoLessons(ch) {
            // Create synthetic lessons from chapter data for curriculum-only mode
            const syntheticLessons = [
                { title: ch.title + ' — Introdução' },
                { title: ch.title + ' — Desenvolvimento' },
                { title: ch.title + ' — Exercícios Práticos' },
            ];
            return `<div class="divide-y divide-gray-50">
                ${syntheticLessons.map((l, i) => `
                <a href="/lesson.html?id=${ch.id}-l${i+1}&chapter=${encodeURIComponent(ch.title)}&subject=${encodeURIComponent(subjectMeta.name||subjectName)}&grade=${encodeURIComponent(gradeName)}&country=${encodeURIComponent(countryCode)}"
                   class="lesson-item flex items-center gap-4 px-5 py-4 group">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 bg-gray-100 group-hover:bg-purple-100 transition">
                        <i class="fas fa-play text-gray-400 group-hover:text-purple-600 text-xs transition"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 mb-0.5">
                            <span class="text-xs font-semibold text-gray-400">Lição ${i+1}</span>
                            
                        </div>
                        <h4 class="text-sm font-semibold text-gray-800 group-hover:text-purple-700 transition truncate">${l.title}</h4>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200 group-hover:text-purple-400 text-xs flex-shrink-0 transition"></i>
                </a>`).join('')}
            </div>`;
        }

        // ── Load from curriculum API ──────────────────────────────────────
        async function loadChapters() {
            try {
                // Try to load from curriculum API (real data)
                const r = await fetch(`/api/curriculum/tree/${countryCode}`);
                const d = await r.json();
                if (!d.success) throw new Error('API error');

                const curriculum = d.data?.curriculum || [];
                let foundChapters = [];
                let foundSubject  = {};

                // Traverse the curriculum tree to find matching subject
                outer: for (const level of curriculum) {
                    for (const grade of (level.grades || [])) {
                        // Match by gradeId or grade shortName
                        const gradeMatch = !gradeId || grade.id === gradeId ||
                            grade.shortName?.toLowerCase() === gradeId?.toLowerCase() ||
                            grade.name?.toLowerCase().includes(gradeId?.toLowerCase());

                        for (const subject of (grade.subjects || [])) {
                            const subjectMatch = !subjectId || subject.id === subjectId ||
                                subject.shortName?.toLowerCase() === subjectId?.toLowerCase() ||
                                subject.name?.toLowerCase().includes(subjectName?.toLowerCase());

                            if (subjectMatch && gradeMatch) {
                                foundChapters = subject.chapters || [];
                                foundSubject  = subject;
                                // Update breadcrumb
                                document.getElementById('bc-country').textContent  = d.data.name || countryCode.toUpperCase();
                                document.getElementById('bc-grade').textContent    = grade.name || gradeName;
                                document.getElementById('bc-subject').textContent  = subject.name || subjectName;
                                break outer;
                            }
                        }
                    }
                }

                if (foundChapters.length === 0) {
                    // If no match, try old content API fallback
                    await loadFromContentAPI();
                    return;
                }

                subjectMeta = foundSubject;
                allChapters = foundChapters;

                // Update stats
                document.getElementById('stats-bar').classList.remove('hidden');
                document.getElementById('stat-chapters').textContent = foundChapters.length;
                const totalLessons = foundChapters.reduce((s, ch) => s + (ch.lessons?.length || 0), 0);
                document.getElementById('stat-lessons').textContent  = totalLessons || foundChapters.length * 3 + '+';

                renderSubjectHeader(foundSubject, foundChapters);
                renderChapters(foundChapters);

                // Auto-expand first chapter
                if (foundChapters[0]) {
                    toggleChapter(foundChapters[0].id);
                }

                // Try to load real progress
                loadProgress();

            } catch(err) {
                console.warn('Curriculum API error, falling back:', err);
                await loadFromContentAPI();
            }
        }

        async function loadFromContentAPI() {
            // Fallback to old content API
            try {
                const gsId = subjectId || gradeId;
                const result = await VClass.api.content.getChapters(gsId);
                if (result.success && result.data.length > 0) {
                    allChapters = result.data;
                    subjectMeta = { name: subjectName, color: '#7c3aed', icon: 'fa-book' };
                    renderSubjectHeader(subjectMeta, allChapters);
                    renderChapters(allChapters);
                    document.getElementById('stats-bar').classList.remove('hidden');
                    document.getElementById('stat-chapters').textContent = allChapters.length;
                } else {
                    showEmpty();
                }
            } catch(e) {
                showError();
            }
        }

        async function loadProgress() {
            try {
                const gsId = subjectId || gradeId;
                const result = await VClass.api.progress.getSubjectProgress(gsId);
                if (result.success && result.data?.summary) {
                    const pct = result.data.summary.overallProgress || 0;
                    document.getElementById('stat-progress').textContent = pct + '%';
                    const ring = document.getElementById('progress-ring');
                    if (ring) {
                        const offset = 163.36 * (1 - pct / 100);
                        ring.style.strokeDashoffset = offset;
                        document.getElementById('progress-pct').textContent = pct + '%';
                    }
                }
            } catch(e) { /* progress optional */ }
        }

        function showEmpty() {
            document.getElementById('subject-header').innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fas fa-book text-purple-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-gray-800">${subjectName || 'Disciplina'}</h1>
                </div>`;
            document.getElementById('chapters-container').innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm p-12 text-center border border-gray-100">
                    <i class="fas fa-folder-open text-5xl text-gray-200 mb-4 block"></i>
                    <h2 class="text-xl font-bold text-gray-600 mb-2">Conteúdo em preparação</h2>
                    <p class="text-gray-400 text-sm mb-6">Esta disciplina ainda não tem capítulos publicados.</p>
                    <a href="/browse.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-purple-600 text-white rounded-xl text-sm font-semibold hover:bg-purple-700 transition">
                        <i class="fas fa-compass"></i> Explorar outras disciplinas
                    </a>
                </div>`;
        }

        function showError() {
            document.getElementById('chapters-container').innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
                    <i class="fas fa-exclamation-circle text-3xl text-red-400 mb-2 block"></i>
                    <p class="text-red-700 font-medium">Erro ao carregar capítulos</p>
                    <button onclick="loadChapters()" class="mt-3 text-sm text-red-600 underline hover:text-red-700">Tentar novamente</button>
                </div>`;
        }

        // ── Init ──────────────────────────────────────────────────────────
        loadChapters();
    </script>
</body>
</html>
