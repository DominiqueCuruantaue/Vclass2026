<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .notif-card { transition: all 0.25s ease; border: 1.5px solid #f3f4f6; }
        .notif-card:hover { border-color: #e9d5ff; box-shadow: 0 4px 16px rgba(109,40,217,0.08); transform: translateX(3px); }
        .notif-unread { border-left: 3px solid #7c3aed; background: linear-gradient(to right, #faf5ff 0%, white 60%); }
        .unread-dot { animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.7; transform: scale(1.2); } }
        .filter-tab { transition: all 0.2s; border: 1.5px solid transparent; }
        .filter-tab.active { background: #7c3aed; color: white; border-color: #7c3aed; }
        .filter-tab:not(.active) { background: white; color: #6b7280; border-color: #e5e7eb; }
        .filter-tab:not(.active):hover { border-color: #7c3aed; color: #7c3aed; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .notif-card { animation: slideIn 0.3s ease forwards; }
    </style>
  <script src="/static/safe-dom.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8 max-w-3xl">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <i class="fas fa-bell text-purple-600"></i> Notificações
                    <span id="unread-badge" class="px-2 py-0.5 bg-red-500 text-white text-xs font-bold rounded-full hidden">0</span>
                </h1>
                <p class="text-gray-500 text-sm mt-0.5">Fique por dentro das suas atividades</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="markAllRead()" class="text-sm text-purple-600 hover:text-purple-700 font-medium flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-purple-50 transition">
                    <i class="fas fa-check-double text-xs"></i> Marcar todas como lidas
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-2 mb-5">
            <button class="filter-tab active px-3.5 py-2 rounded-xl text-xs font-semibold" onclick="setFilter('all', this)">
                <i class="fas fa-th-list mr-1"></i> Todas <span id="cnt-all" class="opacity-70">6</span>
            </button>
            <button class="filter-tab px-3.5 py-2 rounded-xl text-xs font-semibold" onclick="setFilter('unread', this)">
                <i class="fas fa-envelope mr-1"></i> Não Lidas <span id="cnt-unread" class="opacity-70">3</span>
            </button>
            <button class="filter-tab px-3.5 py-2 rounded-xl text-xs font-semibold" onclick="setFilter('achievement', this)">
                <i class="fas fa-trophy mr-1"></i> Conquistas
            </button>
            <button class="filter-tab px-3.5 py-2 rounded-xl text-xs font-semibold" onclick="setFilter('lesson', this)">
                <i class="fas fa-video mr-1"></i> Aulas
            </button>
            <button class="filter-tab px-3.5 py-2 rounded-xl text-xs font-semibold" onclick="setFilter('exercise', this)">
                <i class="fas fa-tasks mr-1"></i> Exercícios
            </button>
        </div>

        <!-- Actions row -->
        <div class="flex justify-end mb-3">
            <button onclick="clearAll()" class="text-xs text-red-500 hover:text-red-600 flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-red-50 transition">
                <i class="fas fa-trash-alt"></i> Limpar tudo
            </button>
        </div>

        <!-- Notifications List -->
        <div id="notif-list" class="space-y-2"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-bell-slash text-gray-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-700 mb-1">Tudo limpo!</h3>
            <p class="text-gray-500 text-sm mb-5">Você está em dia com todas as notificações</p>
            <a href="/browse.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-purple-600 text-white rounded-xl text-sm font-semibold hover:bg-purple-700 transition">
                <i class="fas fa-compass"></i> Explorar Conteúdo
            </a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        if (!VClass.isAuthenticated()) window.location.href = '/login.html';
        VClass.initNavbar('notifications');

        let currentFilter = 'all';
        let NOTIFS = [];
        let _loaded = false;

        // ── Carregar da API ─────────────────────────────────────────────────────
        async function loadNotifications() {
            try {
                const token = localStorage.getItem('accessToken') || localStorage.getItem('token') || '';
                const res = await fetch('/api/notifications', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const json = await res.json();
                if (json.success && Array.isArray(json.data)) {
                    // Merge: prioridade para API, mas preserva estado read do localStorage
                    const localState = VClass.storage.get('notifications_read_state') || {};
                    NOTIFS = json.data.map(n => ({
                        id: n.id,
                        type: n.type,
                        title: n.title,
                        msg: n.message,
                        read: localState[n.id] !== undefined ? localState[n.id] : n.read,
                        time: n.created_at,
                        action_url: n.action_url
                    }));
                } else {
                    throw new Error('API returned no data');
                }
            } catch(e) {
                // Fallback para localStorage
                NOTIFS = VClass.storage.get('notifications_v2') || [];
            }
            _loaded = true;
            render();
        }

        loadNotifications();

        const TYPE_STYLE = {
            achievement: { icon: 'fa-trophy', color: '#f59e0b', bg: '#fffbeb' },
            lesson:      { icon: 'fa-play-circle', color: '#6366f1', bg: '#eef2ff' },
            exercise:    { icon: 'fa-check-circle', color: '#22c55e', bg: '#f0fdf4' },
            default:     { icon: 'fa-bell', color: '#7c3aed', bg: '#faf5ff' },
        };

        function render() {
            const filtered = NOTIFS.filter(n => {
                if (currentFilter === 'unread') return !n.read;
                if (currentFilter === 'all') return true;
                return n.type === currentFilter;
            });

            const unread = NOTIFS.filter(n => !n.read).length;
            document.getElementById('cnt-all').textContent = NOTIFS.length;
            document.getElementById('cnt-unread').textContent = unread;
            const badge = document.getElementById('unread-badge');
            if (unread > 0) { badge.textContent = unread; badge.classList.remove('hidden'); }
            else badge.classList.add('hidden');

            if (!filtered.length) {
                document.getElementById('notif-list').innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');

            document.getElementById('notif-list').innerHTML = filtered.map(n => {
                const s = TYPE_STYLE[n.type] || TYPE_STYLE.default;
                return `
                <div class="notif-card ${!n.read ? 'notif-unread' : ''} bg-white rounded-2xl p-4 cursor-pointer"
                     onclick="markRead('${n.id}')">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${s.bg}">
                            <i class="fas ${s.icon}" style="color:${s.color}; font-size:1rem;"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between gap-2">
                                <h3 class="font-semibold text-gray-900 text-sm leading-tight">${n.title}</h3>
                                <div class="flex items-center gap-1.5 flex-shrink-0">
                                    ${!n.read ? '<span class="unread-dot w-2 h-2 bg-purple-500 rounded-full"></span>' : ''}
                                    <button onclick="deleteNotif(event,'${n.id}')" class="text-gray-300 hover:text-red-400 transition p-0.5" title="Remover">
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-0.5 leading-relaxed">${n.msg}</p>
                            <p class="text-xs text-gray-400 mt-1.5">
                                <i class="fas fa-clock mr-1"></i>${VClass.formatRelativeTime(n.time)}
                            </p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function markRead(id) {
            const n = NOTIFS.find(x => x.id === id);
            if (n && !n.read) {
                n.read = true;
                saveReadState();
                render();
                // Notificar API (fire-and-forget)
                const token = localStorage.getItem('accessToken') || localStorage.getItem('token') || '';
                fetch(`/api/notifications/${id}/read`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                }).catch(() => {});
            }
            // Navegar se tiver action_url
            if (n?.action_url) {
                setTimeout(() => { window.location.href = n.action_url; }, 300);
            }
        }

        function markAllRead() {
            NOTIFS.forEach(n => n.read = true);
            saveReadState();
            render();
            VClass.showNotification('Todas marcadas como lidas', 'success');
            const token = localStorage.getItem('accessToken') || localStorage.getItem('token') || '';
            fetch('/api/notifications/mark-all-read', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            }).catch(() => {});
        }

        function deleteNotif(e, id) {
            e.stopPropagation();
            NOTIFS = NOTIFS.filter(n => n.id !== id);
            saveReadState();
            render();
        }

        function clearAll() {
            if (!confirm('Remover todas as notificações?')) return;
            NOTIFS = [];
            VClass.storage.remove('notifications_read_state');
            render();
        }

        function saveReadState() {
            const state = {};
            NOTIFS.forEach(n => { state[n.id] = n.read; });
            VClass.storage.set('notifications_read_state', state);
        }
    </script>
</body>
</html>
