<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </div>
                    <div class="hidden md:flex space-x-4">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-book mr-1"></i> Conteúdo
                        </a>
                        <a href="/my-progress.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-sm text-gray-700"></span>
                    <button onclick="VClass.logout()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Welcome Section -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                Olá, <span id="welcome-name">Estudante</span>! 👋
            </h1>
            <p class="text-gray-600">Continue sua jornada de aprendizado</p>
        </div>

        <!-- Stats Cards -->
        <div id="stats-container" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <!-- Loading skeleton -->
            <div class="bg-white p-6 rounded-lg shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-8 bg-gray-200 rounded w-1/2"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Recent Activity -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">
                        <i class="fas fa-clock text-purple-600 mr-2"></i>
                        Atividade Recente
                    </h2>
                    <div id="recent-activity" class="space-y-4">
                        <!-- Loading -->
                        <div class="animate-pulse space-y-4">
                            <div class="h-20 bg-gray-100 rounded"></div>
                            <div class="h-20 bg-gray-100 rounded"></div>
                            <div class="h-20 bg-gray-100 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subject Progress -->
            <div>
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">
                        <i class="fas fa-book-open text-purple-600 mr-2"></i>
                        Progresso por Disciplina
                    </h2>
                    <div id="subject-progress" class="space-y-4">
                        <!-- Loading -->
                        <div class="animate-pulse space-y-4">
                            <div class="h-16 bg-gray-100 rounded"></div>
                            <div class="h-16 bg-gray-100 rounded"></div>
                            <div class="h-16 bg-gray-100 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Browse Content CTA -->
        <div class="mt-8 bg-gradient-to-r from-purple-600 to-purple-800 rounded-lg shadow-lg p-8 text-white text-center">
            <h2 class="text-2xl font-bold mb-2">Pronto para aprender mais?</h2>
            <p class="mb-6 text-purple-100">Explore nosso catálogo de disciplinas e lições</p>
            <a href="/browse.html" class="inline-flex items-center px-6 py-3 bg-white text-purple-600 rounded-lg font-semibold hover:bg-gray-100 transition">
                <i class="fas fa-search mr-2"></i>
                Explorar Conteúdo
            </a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // Check authentication
        if (!VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = VClass.getCurrentUser();
        if (user && user.role !== 'student') {
            window.location.href = '/teacher-dashboard.html';
        }

        // Update user name
        if (user) {
            document.getElementById('user-name').textContent = user.full_name;
            document.getElementById('welcome-name').textContent = user.full_name.split(' ')[0];
        }

        // Load dashboard data
        async function loadDashboard() {
            try {
                const result = await VClass.api.progress.getDashboard();

                if (result.success) {
                    const { summary, recentActivity, subjectProgress } = result.data;

                    // Render stats
                    renderStats(summary);

                    // Render recent activity
                    renderRecentActivity(recentActivity);

                    // Render subject progress
                    renderSubjectProgress(subjectProgress);
                } else {
                    console.error('Failed to load dashboard:', result.error);
                }
            } catch (error) {
                console.error('Dashboard error:', error);
            }
        }

        function renderStats(summary) {
            const statsContainer = document.getElementById('stats-container');
            const timeSpent = Math.floor(summary.total_time_spent_seconds / 60); // Convert to minutes

            statsContainer.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600 mb-1">Lições Completas</p>
                            <p class="text-3xl font-bold text-purple-600">${summary.lessons_completed || 0}</p>
                        </div>
                        <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-check text-purple-600 text-xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600 mb-1">Exercícios Feitos</p>
                            <p class="text-3xl font-bold text-blue-600">${summary.exercises_completed || 0}</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-tasks text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600 mb-1">Pontuação Média</p>
                            <p class="text-3xl font-bold text-green-600">${Math.round(summary.avg_score || 0)}%</p>
                        </div>
                        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-star text-green-600 text-xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600 mb-1">Tempo de Estudo</p>
                            <p class="text-3xl font-bold text-orange-600">${timeSpent}min</p>
                        </div>
                        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-clock text-orange-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRecentActivity(activities) {
            const container = document.getElementById('recent-activity');

            if (!activities || activities.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-2"></i>
                        <p>Nenhuma atividade recente</p>
                        <a href="/browse.html" class="text-purple-600 hover:text-purple-700 text-sm mt-2 inline-block">
                            Começar a aprender
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = activities.map(activity => `
                <div class="flex items-center space-x-4 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="${activity.lesson?.thumbnail_url || 'https://via.placeholder.com/80'}" 
                         alt="${activity.lesson?.title}" 
                         class="w-20 h-20 rounded object-cover">
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-900">${activity.lesson?.title || 'Lição'}</h3>
                        <div class="flex items-center space-x-4 mt-1">
                            <span class="text-sm text-gray-600">
                                ${activity.progress_percent}% completo
                            </span>
                            <span class="text-xs text-gray-400">
                                ${new Date(activity.updated_at).toLocaleDateString('pt')}
                            </span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                            <div class="bg-purple-600 h-2 rounded-full" style="width: ${activity.progress_percent}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderSubjectProgress(subjects) {
            const container = document.getElementById('subject-progress');

            if (!subjects || subjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-gray-500">
                        <p class="text-sm">Sem progresso ainda</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = subjects.slice(0, 5).map(subject => `
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${subject.subject_color}"></div>
                            <span class="font-medium text-gray-900">${subject.subject_name}</span>
                        </div>
                        <span class="text-sm font-semibold text-gray-700">${subject.progress_percent || 0}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="h-2 rounded-full" 
                             style="width: ${subject.progress_percent || 0}%; background-color: ${subject.subject_color}">
                        </div>
                    </div>
                    <p class="text-xs text-gray-500">
                        ${subject.completed_lessons || 0} de ${subject.total_lessons || 0} lições
                    </p>
                </div>
            `).join('');
        }

        // Load data on page load
        loadDashboard();
    </script>
</body>
</html>
