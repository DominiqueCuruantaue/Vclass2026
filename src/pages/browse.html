<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Explorar Conteúdo - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .card-item {
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            cursor: pointer;
        }
        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(109,40,217,0.14);
        }
        .card-item:active { transform: translateY(-2px); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .grid-item { animation: fadeInUp 0.35s ease forwards; opacity: 0; }
        .grid-item:nth-child(1) { animation-delay: 0.05s; }
        .grid-item:nth-child(2) { animation-delay: 0.10s; }
        .grid-item:nth-child(3) { animation-delay: 0.15s; }
        .grid-item:nth-child(4) { animation-delay: 0.20s; }
        .grid-item:nth-child(5) { animation-delay: 0.25s; }
        .grid-item:nth-child(6) { animation-delay: 0.30s; }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .breadcrumb-item { transition: color 0.2s; }
        .subject-card-icon { transition: transform 0.3s; }
        .card-item:hover .subject-card-icon { transform: scale(1.1) rotate(5deg); }
        .pill-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; }
        .view-btn { padding: 4px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; border: 1.5px solid #7c3aed; color: #7c3aed; background: transparent; cursor: pointer; transition: all 0.2s; }
        .view-btn:hover { background: #7c3aed; color: white; }
    </style>
  <script src="/static/safe-dom.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar placeholder (filled by JS) -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-7xl">

        <!-- Page Header -->
        <div class="mb-6">
            <!-- Breadcrumb -->
            <nav class="flex items-center gap-2 text-sm mb-4 text-gray-500" id="breadcrumb-nav">
                <a href="/browse.html" class="hover:text-purple-600 transition flex items-center gap-1">
                    <i class="fas fa-compass text-purple-500"></i>
                    <span>Explorar</span>
                </a>
            </nav>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 id="page-title" class="text-2xl md:text-3xl font-bold text-gray-900">
                        Explorar Conteúdo
                    </h1>
                    <p id="page-subtitle" class="text-gray-500 text-sm mt-1">
                        Selecione o país e série para começar
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="back-btn" onclick="goBack()" class="hidden items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-purple-300 transition shadow-sm">
                        <i class="fas fa-arrow-left text-purple-500"></i> Voltar
                    </button>
                </div>
            </div>
        </div>

        <!-- Search bar (visible at subject level) -->
        <div id="search-bar" class="hidden mb-6">
            <div class="relative max-w-md">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Buscar disciplina..."
                    class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent bg-white shadow-sm"
                    oninput="filterItems()">
            </div>
        </div>

        <!-- Content Grid -->
        <div id="content-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Skeleton loaders -->
            <div class="bg-white rounded-2xl p-6 h-40 skeleton"></div>
            <div class="bg-white rounded-2xl p-6 h-40 skeleton"></div>
            <div class="bg-white rounded-2xl p-6 h-40 skeleton"></div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-20 h-20 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-search text-purple-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-1">Nenhum resultado encontrado</h3>
            <p class="text-gray-500 text-sm">Tente outro termo de busca</p>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // ─── Init ───────────────────────────────────────────────────────────────
        // /api/curriculum/full é público — não precisa de token para navegar
        VClass.initNavbar('browse');

        // Navigation state
        const nav = { history: [], current: 'countries', countryId: null, countryName: '', gradeId: null, gradeName: '' };
        let _curriculum = null; // [{id, code, flag, name, educationTerms, levels:[...]}]

        // Init
        loadCountries();

        // ─── Load Countries ──────────────────────────────────────────────────────
        async function loadCountries() {
            nav.current = 'countries';
            nav.history = [];
            setHeader('Explorar Conteúdo', 'Selecione o país do sistema educacional');
            updateBreadcrumb([]);
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('flex');
            document.getElementById('search-bar').classList.add('hidden');
            showSkeleton(3);
            try {
                if (!_curriculum) {
                    const res  = await fetch('/api/curriculum/full');
                    const json = await res.json();
                    if (!json.success) throw new Error('API error');
                    _curriculum = json.data;
                }
                renderCountries(_curriculum);
            } catch(e) { showError('Erro ao carregar países: ' + e.message); }
        }

        function renderCountries(countries) {
            const html = countries.map((c) => `
                <div class="card-item grid-item bg-white rounded-2xl p-6 shadow-sm border border-gray-100 hover:border-purple-200"
                     onclick="selectCountry('${c.id}', '${escHtml(c.name)}')">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-5xl">${c.flag || '🌍'}</span>
                        <div class="w-9 h-9 bg-purple-50 rounded-xl flex items-center justify-center">
                            <i class="fas fa-arrow-right text-purple-400 text-sm"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-gray-900 mb-1">${c.name}</h3>
                    <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">${c.code || ''}</p>
                    <div class="mt-4 flex items-center gap-2 flex-wrap">
                        <span class="pill-badge bg-purple-50 text-purple-700"><i class="fas fa-layer-group"></i> ${c.levels?.length || 0} níveis</span>
                        <span class="pill-badge bg-blue-50 text-blue-700"><i class="fas fa-calendar"></i> ${c.educationTerms || 'trimestres'}</span>
                    </div>
                </div>
            `).join('');
            setGrid(html, false);
        }

        // ─── Select Country → Load Levels + Grades ───────────────────────────────
        function selectCountry(countryId, countryName) {
            nav.history.push({ type: 'countries' });
            nav.current = 'grades';
            nav.countryId = countryId;
            nav.countryName = countryName;

            setHeader(`${countryName}`, 'Selecione o nível de ensino e a classe');
            updateBreadcrumb([{ label: countryName, icon: 'flag' }]);
            showBackBtn();
            document.getElementById('search-bar').classList.add('hidden');

            const country = _curriculum?.find(c => c.id === countryId);
            if (!country) { showError('País não encontrado'); return; }

            renderLevels(country.levels, countryName);
        }

        // ─── Paleta de estilos por nível ─────────────────────────────────────────
        function getLevelTheme(shortName, levelName) {
            const s = (shortName || '').toLowerCase();
            const n = (levelName || '').toLowerCase();
            // Ensino Primário / Básico I
            if (s === 'ep1' || s === 'ef1' || s === '1eb' || s === 'eb')
                return { accent: '#2563eb', light: '#dbeafe', icon: 'fa-seedling',    ring: 'ring-blue-300',   btn: 'bg-blue-600 hover:bg-blue-700 text-white',   badge: 'bg-blue-100 text-blue-700',   sectionBg: 'bg-blue-50',   border: 'border-blue-200' };
            // Ensino Primário 2º Grau / Básico II
            if (s === 'ep2' || s === 'ef1b' || s === '2eb')
                return { accent: '#0891b2', light: '#cffafe', icon: 'fa-book',        ring: 'ring-cyan-300',   btn: 'bg-cyan-600 hover:bg-cyan-700 text-white',   badge: 'bg-cyan-100 text-cyan-700',   sectionBg: 'bg-cyan-50',   border: 'border-cyan-200' };
            // Básico III / EF2
            if (s === 'ef2' || s === '3eb')
                return { accent: '#0d9488', light: '#ccfbf1', icon: 'fa-book-open',   ring: 'ring-teal-300',   btn: 'bg-teal-600 hover:bg-teal-700 text-white',   badge: 'bg-teal-100 text-teal-700',   sectionBg: 'bg-teal-50',   border: 'border-teal-200' };
            // Secundário I Ciclo / EF2 avançado
            if (s === 'es1' || s === 'esg1')
                return { accent: '#16a34a', light: '#dcfce7', icon: 'fa-graduation-cap', ring: 'ring-green-300', btn: 'bg-green-600 hover:bg-green-700 text-white', badge: 'bg-green-100 text-green-700', sectionBg: 'bg-green-50', border: 'border-green-200' };
            // Ensino Médio / Secundário II / ES
            if (s === 'es2' || s === 'esg2' || s === 'em' || s === 'es' || s === 'sec')
                return { accent: '#7c3aed', light: '#ede9fe', icon: 'fa-university',  ring: 'ring-purple-300', btn: 'bg-purple-600 hover:bg-purple-700 text-white', badge: 'bg-purple-100 text-purple-700', sectionBg: 'bg-purple-50', border: 'border-purple-200' };
            // Técnico-Profissional / EJA / CP
            if (s === 'etp' || s === 'eja' || s === 'cp')
                return { accent: '#d97706', light: '#fef3c7', icon: 'fa-tools',       ring: 'ring-amber-300',  btn: 'bg-amber-600 hover:bg-amber-700 text-white',  badge: 'bg-amber-100 text-amber-700',  sectionBg: 'bg-amber-50',  border: 'border-amber-200' };
            // fallback
            return     { accent: '#6b7280', light: '#f3f4f6', icon: 'fa-layer-group', ring: 'ring-gray-300',   btn: 'bg-gray-600 hover:bg-gray-700 text-white',   badge: 'bg-gray-100 text-gray-700',   sectionBg: 'bg-gray-50',   border: 'border-gray-200' };
        }

        // ─── Render: painéis de nível com classes em linha ───────────────────────
        function renderLevels(levels, countryName) {
            const activeLevels = levels.filter(l => l.grades && l.grades.length > 0);
            if (!activeLevels.length) { showError('Nenhuma classe disponível para este país.'); return; }

            const html = activeLevels.map((level, li) => {
                const theme = getLevelTheme(level.shortName, level.name);
                const totalSubjects = level.grades.reduce((acc, g) => acc + (g.subjects?.length || 0), 0);

                const gradeCards = level.grades.map((g, gi) => `
                    <button
                        onclick="selectGrade('${g.id}', '${escHtml(g.name)}', '${escHtml(countryName)}')"
                        class="grade-chip group flex flex-col items-center gap-2 p-4 rounded-2xl border-2 ${theme.border} bg-white hover:shadow-lg transition-all duration-200 hover:-translate-y-1 min-w-[100px] flex-shrink-0"
                        style="animation-delay: ${(li * 0.08 + gi * 0.04).toFixed(2)}s">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-sm" style="background:${theme.accent}">
                            ${g.shortName || (gi + 1)}
                        </div>
                        <div class="text-center">
                            <p class="text-xs font-bold text-gray-800 leading-tight">${g.name}</p>
                            ${g.subjects?.length ? `<p class="text-[10px] text-gray-400 mt-0.5">${g.subjects.length} disciplinas</p>` : ''}
                        </div>
                    </button>
                `).join('');

                return `
                <div class="level-panel rounded-2xl border ${theme.border} overflow-hidden mb-5"
                     style="animation: fadeInUp 0.4s ease both; animation-delay: ${(li * 0.12).toFixed(2)}s">
                    <!-- Cabeçalho do nível -->
                    <div class="flex items-center justify-between px-5 py-3.5" style="background:${theme.accent}">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                                <i class="fas ${theme.icon} text-white text-sm"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-sm leading-tight">${level.name}</h3>
                                <p class="text-white/70 text-[11px]">${level.description || ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-white/80 text-xs hidden sm:block">${level.grades.length} classe${level.grades.length !== 1 ? 's' : ''}</span>
                            ${totalSubjects > 0 ? `<span class="bg-white/20 text-white text-[11px] font-semibold px-2.5 py-1 rounded-full">${totalSubjects} disciplinas</span>` : ''}
                        </div>
                    </div>
                    <!-- Classes em linha scrollável -->
                    <div class="${theme.sectionBg} px-4 py-4">
                        <div class="flex flex-wrap gap-3">
                            ${gradeCards}
                        </div>
                    </div>
                </div>`;
            }).join('');

            // Usar container full-width em vez do grid
            const grid = document.getElementById('content-grid');
            grid.className = 'w-full';
            grid.innerHTML = html;
        }

        // ─── Select Grade → Load Subjects ────────────────────────────────────────
        function selectGrade(gradeId, gradeName, countryName) {
            nav.history.push({ type: 'grades', countryId: nav.countryId, countryName });
            nav.current = 'subjects';
            nav.gradeId = gradeId;
            nav.gradeName = gradeName;

            setHeader(`${gradeName} — Disciplinas`, 'Escolha a disciplina para começar a estudar');
            updateBreadcrumb([
                { label: countryName, icon: 'flag', onclick: `selectCountryFromBreadcrumb('${nav.countryId}','${escHtml(countryName)}')` },
                { label: gradeName, icon: 'layer-group' }
            ]);
            showBackBtn();
            document.getElementById('search-bar').classList.remove('hidden');

            const country = _curriculum?.find(c => c.id === nav.countryId);
            let grade = null;
            country?.levels?.forEach(l => { const g = l.grades.find(g => g.id === gradeId); if (g) grade = g; });
            if (!grade) { showError('Classe não encontrada'); return; }
            window._allSubjects = grade.subjects || [];
            renderSubjects(window._allSubjects);
        }

        function renderSubjects(subjects) {
            if (!subjects.length) {
                setGrid('', false);
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');

            const subjectIcons = {
                'Matemática': { icon: 'calculator', color: '#6366f1' },
                'Português': { icon: 'book-open', color: '#ec4899' },
                'Física': { icon: 'atom', color: '#14b8a6' },
                'Química': { icon: 'flask', color: '#f59e0b' },
                'Biologia': { icon: 'leaf', color: '#22c55e' },
                'História': { icon: 'landmark', color: '#a855f7' },
                'Geografia': { icon: 'globe-americas', color: '#0ea5e9' },
                'Inglês': { icon: 'language', color: '#f97316' },
                'Francês': { icon: 'language', color: '#3b82f6' },
                'Filosofia': { icon: 'brain', color: '#8b5cf6' },
                'Informática':       { icon: 'laptop-code',    color: '#06b6d4' },
                'Física e Química':  { icon: 'atom',          color: '#0d9488' },
                'Biologia e Geologia': { icon: 'leaf',        color: '#16a34a' },
                'Empreendedorismo':  { icon: 'lightbulb',     color: '#f59e0b' },
                'Educação Física':   { icon: 'running',       color: '#10b981' },
                'Educação Visual':   { icon: 'palette',       color: '#a855f7' },
                'TIC':               { icon: 'laptop-code',   color: '#3b82f6' },
                'Educação Moral':    { icon: 'heart',         color: '#f43f5e' },
            };

            const html = subjects.map((s) => {
                const meta = subjectIcons[s.name] || { icon: 'book', color: s.color || '#7c3aed' };
                const colorHex = s.color || meta.color;
                return `
                <div class="card-item grid-item bg-white rounded-2xl shadow-sm border border-gray-100 hover:border-purple-200 p-5"
                     onclick="selectSubject('${s.id}', '${escHtml(s.name)}')">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-14 h-14 rounded-2xl flex items-center justify-center subject-card-icon flex-shrink-0"
                             style="background: ${colorHex}18">
                            <i class="fas fa-${meta.icon} text-2xl" style="color: ${colorHex}"></i>
                        </div>
                        <button class="view-btn">Ver aulas</button>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg mb-1">${s.name}</h3>
                    <p class="text-xs text-gray-500 mb-4 line-clamp-2">${s.description || 'Capítulos e exercícios interativos'}</p>
                    <div class="flex items-center gap-3 text-xs text-gray-400">
                        <span class="flex items-center gap-1"><i class="fas fa-layer-group text-purple-400"></i> Capítulos</span>
                        <span class="flex items-center gap-1"><i class="fas fa-video text-blue-400"></i> Vídeos</span>
                        <span class="flex items-center gap-1"><i class="fas fa-tasks text-green-400"></i> Exercícios</span>
                    </div>
                </div>`;
            }).join('');
            setGrid(html, false);
        }

        function filterItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            if (!window._allSubjects) return;
            const filtered = q ? window._allSubjects.filter(s => s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q)) : window._allSubjects;
            renderSubjects(filtered);
        }

        // ─── Navigate to Chapters ────────────────────────────────────────────────
        function selectSubject(subjectId, subjectName) {
            const url = `/chapters.html?country=${encodeURIComponent(nav.countryId || '')}&gradeId=${encodeURIComponent(nav.gradeId || '')}&subjectId=${encodeURIComponent(subjectId)}&subject=${encodeURIComponent(subjectName)}&gradeName=${encodeURIComponent(nav.gradeName)}&gs=${encodeURIComponent(subjectId)}`;
            window.location.href = url;
        }

        function selectCountryFromBreadcrumb(countryId, countryName) {
            selectCountry(countryId, countryName);
        }

        // ─── Go Back ─────────────────────────────────────────────────────────────
        function goBack() {
            if (!nav.history.length) return;
            const prev = nav.history.pop();
            if (prev.type === 'countries') {
                nav.countryId = null;
                nav.countryName = '';
                loadCountries();
            } else if (prev.type === 'grades') {
                nav.gradeId = null;
                nav.gradeName = '';
                selectCountry(prev.countryId || nav.countryId, prev.countryName || nav.countryName);
            }
        }

        // ─── UI Helpers ──────────────────────────────────────────────────────────
        function setHeader(title, subtitle) {
            document.getElementById('page-title').textContent = title;
            document.getElementById('page-subtitle').textContent = subtitle;
        }

        function updateBreadcrumb(items) {
            const nav_el = document.getElementById('breadcrumb-nav');
            const base = `<a href="/browse.html" onclick="loadCountries(); return false;" class="hover:text-purple-600 transition flex items-center gap-1"><i class="fas fa-compass text-purple-500"></i><span>Explorar</span></a>`;
            const crumbs = items.map(item => `
                <span class="text-gray-300">/</span>
                ${item.onclick 
                    ? `<button onclick="${item.onclick}" class="hover:text-purple-600 transition">${item.label}</button>`
                    : `<span class="text-gray-700 font-medium">${item.label}</span>`
                }
            `).join('');
            nav_el.innerHTML = base + crumbs;
        }

        function showBackBtn() {
            const btn = document.getElementById('back-btn');
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        }

        function showSkeleton(count) {
            const html = Array(count).fill('<div class="bg-white rounded-2xl h-48 skeleton"></div>').join('');
            setGrid(html, false);
        }

        function setGrid(html, fullWidth) {
            const grid = document.getElementById('content-grid');
            grid.className = fullWidth
                ? 'w-full'
                : 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5';
            grid.innerHTML = html;
        }

        function showError(msg) {
            setGrid(`
                <div class="col-span-full text-center py-16">
                    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-exclamation-circle text-red-400 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Erro ao carregar</h3>
                    <p class="text-gray-500 text-sm">${msg}</p>
                    <button onclick="loadCountries()" class="mt-4 px-5 py-2 bg-purple-600 text-white rounded-xl text-sm font-medium hover:bg-purple-700 transition">
                        Tentar novamente
                    </button>
                </div>`);
        }

        function escHtml(s) {
            return (s || '').replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
