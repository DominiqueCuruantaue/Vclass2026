<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .book-card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        .book-card:nth-child(1)  { animation-delay: 0.05s; }
        .book-card:nth-child(2)  { animation-delay: 0.10s; }
        .book-card:nth-child(3)  { animation-delay: 0.15s; }
        .book-card:nth-child(4)  { animation-delay: 0.20s; }
        .book-card:nth-child(5)  { animation-delay: 0.25s; }
        .book-card:nth-child(6)  { animation-delay: 0.30s; }
        .book-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.15); }

        .book-cover {
            position: relative;
            overflow: hidden;
        }
        .book-cover .book-actions {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(0,0,0,0.45);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .book-card:hover .book-actions { opacity: 1; }
        .featured-badge {
            position: absolute; top: 0.75rem; right: 0.75rem; z-index: 10;
        }
        .category-tab {
            transition: all 0.2s ease;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            color: white;
        }
        .star-rating { color: #fbbf24; font-size: 11px; }
        .filter-badge { transition: all 0.2s; }
        .filter-badge.active { background: #7c3aed; color: white; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Modal */
        #book-modal { display: none; }
        #book-modal.open { display: flex; }
    </style>
  <script src="/static/safe-dom.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="navbar-placeholder" style="min-height:64px"></div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-700 to-indigo-600 text-white py-10">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold flex items-center gap-3">
                        <i class="fas fa-book-open"></i> Biblioteca Digital
                    </h1>
                    <p class="text-purple-200 mt-1 text-sm">Livros, apostilas e materiais de estudo</p>
                </div>
                <!-- Search -->
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Buscar título, autor ou disciplina..."
                           class="pl-9 pr-4 py-2.5 rounded-lg text-gray-900 text-sm w-64 focus:ring-2 focus:ring-purple-300 focus:outline-none"
                           oninput="applyFilters()">
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 md:px-6 py-8">

        <!-- Stats row -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center"><i class="fas fa-book text-blue-600 text-xl"></i></div>
                <div><p class="text-xs text-gray-500">Livros</p><p class="text-2xl font-bold text-gray-900" id="stat-books">—</p></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center"><i class="fas fa-file-pdf text-green-600 text-xl"></i></div>
                <div><p class="text-xs text-gray-500">Apostilas</p><p class="text-2xl font-bold text-gray-900" id="stat-handouts">—</p></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center"><i class="fas fa-tasks text-purple-600 text-xl"></i></div>
                <div><p class="text-xs text-gray-500">Exercícios</p><p class="text-2xl font-bold text-gray-900" id="stat-exercises">—</p></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center"><i class="fas fa-download text-orange-600 text-xl"></i></div>
                <div><p class="text-xs text-gray-500">Downloads</p><p class="text-2xl font-bold text-gray-900" id="stat-downloads">—</p></div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap items-center gap-3">
            <!-- Category tabs -->
            <div class="flex gap-2 flex-wrap">
                <button class="category-tab active px-4 py-2 rounded-lg text-sm font-medium" onclick="setCategory('all', this)">
                    <i class="fas fa-th-large mr-1.5"></i>Todos
                </button>
                <button class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-600" onclick="setCategory('books', this)">
                    <i class="fas fa-book mr-1.5"></i>Livros
                </button>
                <button class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-600" onclick="setCategory('handouts', this)">
                    <i class="fas fa-file-pdf mr-1.5"></i>Apostilas
                </button>
                <button class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-600" onclick="setCategory('exercises', this)">
                    <i class="fas fa-tasks mr-1.5"></i>Exercícios
                </button>
            </div>
            <div class="flex gap-2 ml-auto flex-wrap">
                <select id="subject-filter" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-purple-500 focus:outline-none" onchange="applyFilters()">
                    <option value="">Todas as Disciplinas</option>
                </select>
                <select id="grade-filter" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-purple-500 focus:outline-none" onchange="applyFilters()">
                    <option value="">Todas as Classes</option>
                </select>
            </div>
        </div>

        <!-- Featured -->
        <div id="featured-section" class="mb-10">
            <h2 class="text-xl font-bold text-gray-900 mb-4"><i class="fas fa-star text-yellow-500 mr-2"></i>Em Destaque</h2>
            <div id="featured-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- All books -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-900">Todos os Materiais</h2>
            <span id="books-count" class="text-sm text-gray-500"></span>
        </div>
        <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 mb-8"></div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-search text-6xl text-gray-200 mb-4"></i>
            <p class="text-xl text-gray-500">Nenhum material encontrado</p>
            <p class="text-sm text-gray-400 mt-1">Tente ajustar os filtros ou a pesquisa</p>
        </div>
    </div>

    <!-- Book Modal -->
    <div id="book-modal" class="fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden">
            <div id="modal-cover" class="h-40 flex items-center justify-center relative">
                <div id="modal-cover-icon" class="text-5xl text-white/80"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/40 rounded-full flex items-center justify-center text-white hover:bg-black/60">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="flex items-center gap-2 mb-3" id="modal-badges"></div>
                <h3 class="text-xl font-bold text-gray-900 mb-1" id="modal-title"></h3>
                <p class="text-sm text-gray-500 mb-1" id="modal-author"></p>
                <p class="text-sm text-gray-600 mb-4 leading-relaxed" id="modal-desc"></p>
                <div class="grid grid-cols-3 gap-3 text-center text-xs text-gray-500 mb-5">
                    <div class="bg-gray-50 rounded-lg p-2"><i class="fas fa-file-alt text-gray-400 mb-1"></i><div id="modal-pages" class="font-semibold text-gray-700"></div><div>páginas</div></div>
                    <div class="bg-gray-50 rounded-lg p-2"><i class="fas fa-hdd text-gray-400 mb-1"></i><div id="modal-size" class="font-semibold text-gray-700"></div><div>tamanho</div></div>
                    <div class="bg-gray-50 rounded-lg p-2"><i class="fas fa-download text-gray-400 mb-1"></i><div id="modal-downloads" class="font-semibold text-gray-700"></div><div>downloads</div></div>
                </div>
                <div class="flex gap-3">
                    <button onclick="viewBook()" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-semibold text-sm transition">
                        <i class="fas fa-eye mr-2"></i>Visualizar PDF
                    </button>
                    <button onclick="downloadBook()" class="flex-1 py-2.5 border-2 border-purple-600 text-purple-600 hover:bg-purple-50 rounded-xl font-semibold text-sm transition">
                        <i class="fas fa-download mr-2"></i>Descarregar
                    </button>
                </div>
                <button id="modal-offline-btn" onclick="saveOffline()"
                    class="w-full mt-3 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-semibold text-sm transition">
                    <i class="fas fa-box-archive mr-2"></i>Guardar offline (para acesso sem internet)
                </button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/offline.js"></script>
    <script>
        if (!VClass.isAuthenticated()) window.location.href = '/login.html';
        VClass.initNavbar('library');

        // ── Gradientes por disciplina ──────────────────────────────
        const SUBJECT_STYLES = {
            'Matemática': { grad:'from-purple-600 to-indigo-700', icon:'fa-calculator',   bg:'#7c3aed' },
            'Física':     { grad:'from-blue-600 to-cyan-700',     icon:'fa-atom',         bg:'#2563eb' },
            'Química':    { grad:'from-green-500 to-emerald-700', icon:'fa-flask',        bg:'#059669' },
            'Biologia':   { grad:'from-lime-500 to-green-600',    icon:'fa-leaf',         bg:'#16a34a' },
            'Português':  { grad:'from-red-500 to-rose-700',      icon:'fa-book-open',    bg:'#dc2626' },
            'História':   { grad:'from-orange-500 to-amber-600',  icon:'fa-landmark',     bg:'#d97706' },
            'Geografia':  { grad:'from-sky-500 to-blue-600',      icon:'fa-globe-africa', bg:'#0284c7' },
            'Inglês':     { grad:'from-violet-500 to-purple-700', icon:'fa-language',     bg:'#7c3aed' },
        };
        function subStyle(name) {
            return SUBJECT_STYLES[name] || { grad:'from-gray-500 to-gray-700', icon:'fa-file-alt', bg:'#6b7280' };
        }

        // ── Estado global ──────────────────────────────────────────
        let ALL_BOOKS      = [];   // dados da API
        let currentCategory = 'all';
        let activeBook      = null;
        const token = localStorage.getItem('accessToken') || localStorage.getItem('token') || '';

        // ── Helpers ────────────────────────────────────────────────
        function bookSubject(b) { return b.subjects?.name || b.subject || ''; }
        function bookGrade(b)   { return b.grades?.name   || (b.grade ? b.grade + 'ª Classe' : ''); }
        function bookGradeId(b) { return b.grade_id || ''; }
        function bookSubjectId(b) { return b.subject_id || ''; }
        function bookDownloads(b) { return b.downloads_count ?? b.downloads ?? 0; }
        function bookPages(b)   { return b.pages || '—'; }
        function bookSize(b) {
            if (b.file_size_kb) {
                return b.file_size_kb >= 1024
                    ? (b.file_size_kb / 1024).toFixed(1) + ' MB'
                    : b.file_size_kb + ' KB';
            }
            return b.size || '—';
        }
        function fmtDownloads(n) {
            return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
        }

        // ── Stats ──────────────────────────────────────────────────
        function updateStats(books) {
            document.getElementById('stat-books').textContent     = books.filter(b => b.category === 'books').length;
            document.getElementById('stat-handouts').textContent  = books.filter(b => b.category === 'handouts').length;
            document.getElementById('stat-exercises').textContent = books.filter(b => b.category === 'exercises').length;
            const total = books.reduce((s, b) => s + bookDownloads(b), 0);
            document.getElementById('stat-downloads').textContent = fmtDownloads(total);
        }

        // ── Capa do livro ──────────────────────────────────────────
        function coverHtml(b, tall = false) {
            const subj = bookSubject(b);
            const s    = subStyle(subj);
            const h    = tall ? 'h-72' : 'h-48';
            const escapedId = String(b.id).replace(/'/g, "\\'");
            return `<div class="book-cover ${h} bg-gradient-to-br ${s.grad} flex flex-col items-center justify-center relative">
                ${b.cover_url
                    ? `<img src="${b.cover_url}" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40">`
                    : ''}
                <i class="fas ${s.icon} text-5xl text-white/80 mb-2 relative z-10"></i>
                <p class="text-white font-bold text-sm text-center px-4 line-clamp-2 relative z-10">${b.title}</p>
                <div class="book-actions z-10">
                    <button onclick="event.stopPropagation();viewBook('${escapedId}')"
                        class="px-3 py-2 bg-white text-purple-700 rounded-lg text-sm font-semibold hover:bg-purple-50 transition">
                        <i class="fas fa-eye mr-1"></i>Ver
                    </button>
                    <button onclick="event.stopPropagation();downloadBook('${escapedId}')"
                        class="px-3 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold hover:bg-purple-700 transition">
                        <i class="fas fa-download mr-1"></i>Baixar
                    </button>
                </div>
                ${b.is_featured || b.featured ? `<div class="featured-badge"><span class="px-2 py-1 bg-yellow-400 text-yellow-900 text-xs font-bold rounded-full shadow"><i class="fas fa-star mr-1"></i>DESTAQUE</span></div>` : ''}
            </div>`;
        }

        // ── Render destaque ────────────────────────────────────────
        function renderFeatured(list) {
            const feat = list.filter(b => b.is_featured || b.featured);
            const sec  = document.getElementById('featured-section');
            const grid = document.getElementById('featured-grid');
            if (!feat.length) { sec.classList.add('hidden'); return; }
            sec.classList.remove('hidden');
            grid.innerHTML = feat.map(b => {
                const subj = bookSubject(b);
                const s    = subStyle(subj);
                return `<div class="book-card bg-white rounded-2xl shadow overflow-hidden" onclick="openModal('${b.id}')">
                    ${coverHtml(b, true)}
                    <div class="p-5">
                        <div class="flex items-center justify-between mb-2">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full text-white" style="background:${s.bg}">${subj || '—'}</span>
                            <span class="text-xs text-gray-400">${bookGrade(b)}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1 line-clamp-1">${b.title}</h3>
                        <p class="text-xs text-gray-500 mb-2">${b.author}</p>
                        <div class="flex items-center justify-between text-xs text-gray-400">
                            <span>${bookPages(b)} páginas</span>
                            <span><i class="fas fa-download mr-1"></i>${fmtDownloads(bookDownloads(b))}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Render grelha principal ────────────────────────────────
        function renderBooks(list) {
            const nonFeat = list.filter(b => !(b.is_featured || b.featured));
            const grid    = document.getElementById('books-grid');
            const empty   = document.getElementById('empty-state');
            document.getElementById('books-count').textContent = `${list.length} material${list.length !== 1 ? 'is' : ''}`;

            if (!list.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            grid.innerHTML = nonFeat.map(b => {
                const subj = bookSubject(b);
                const s    = subStyle(subj);
                const catLabel = { books:'Livro', handouts:'Apostila', exercises:'Exercícios' }[b.category] || b.category;
                return `<div class="book-card bg-white rounded-2xl shadow-sm overflow-hidden" onclick="openModal('${b.id}')">
                    ${coverHtml(b)}
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="px-2 py-0.5 text-xs font-semibold rounded-full text-white" style="background:${s.bg}">${subj || catLabel}</span>
                            <span class="text-xs text-gray-400">${bookGrade(b)}</span>
                        </div>
                        <h3 class="font-bold text-gray-900 text-sm mb-0.5 line-clamp-2">${b.title}</h3>
                        <p class="text-xs text-gray-500 mb-2 line-clamp-1">${b.author}</p>
                        <div class="flex items-center justify-between text-xs text-gray-400">
                            <span><i class="fas fa-file-alt mr-0.5"></i>${bookPages(b)}p</span>
                            <span><i class="fas fa-download mr-0.5"></i>${fmtDownloads(bookDownloads(b))}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Filtros ────────────────────────────────────────────────
        function getFiltered() {
            const q         = (document.getElementById('search-input').value || '').toLowerCase();
            const subjectId = document.getElementById('subject-filter').value;
            const gradeId   = document.getElementById('grade-filter').value;
            return ALL_BOOKS.filter(b => {
                const matchCat  = currentCategory === 'all' || b.category === currentCategory;
                const matchSubj = !subjectId || bookSubjectId(b) === subjectId;
                const matchGrad = !gradeId   || bookGradeId(b)   === gradeId;
                const matchQ    = !q || b.title.toLowerCase().includes(q)
                                     || (b.author||'').toLowerCase().includes(q)
                                     || bookSubject(b).toLowerCase().includes(q);
                return matchCat && matchSubj && matchGrad && matchQ;
            });
        }

        function applyFilters() {
            const filtered = getFiltered();
            renderFeatured(filtered);
            renderBooks(filtered);
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('active');
                t.classList.add('bg-gray-100', 'text-gray-600');
            });
            btn.classList.add('active');
            btn.classList.remove('bg-gray-100', 'text-gray-600');
            applyFilters();
        }

        // ── Modal de detalhes ──────────────────────────────────────
        function openModal(id) {
            activeBook = ALL_BOOKS.find(b => b.id === id);
            if (!activeBook) return;
            const b    = activeBook;
            const subj = bookSubject(b);
            const s    = subStyle(subj);
            const catLabels = { books:'Livro', handouts:'Apostila', exercises:'Exercícios' };

            document.getElementById('modal-cover').className =
                `h-40 bg-gradient-to-br ${s.grad} flex items-center justify-center relative`;
            document.getElementById('modal-cover-icon').innerHTML =
                `<i class="fas ${s.icon} text-5xl text-white/80"></i>`;
            document.getElementById('modal-title').textContent  = b.title;
            document.getElementById('modal-author').textContent = `Autor: ${b.author}`;
            document.getElementById('modal-desc').textContent   = b.description || b.desc || '';
            document.getElementById('modal-pages').textContent  = bookPages(b);
            document.getElementById('modal-size').textContent   = bookSize(b);
            document.getElementById('modal-downloads').textContent = fmtDownloads(bookDownloads(b));

            document.getElementById('modal-badges').innerHTML =
                `${subj ? `<span class="px-2 py-1 text-xs font-semibold rounded-full text-white" style="background:${s.bg}">${subj}</span>` : ''}
                 ${bookGrade(b) ? `<span class="px-2 py-1 text-xs font-semibold bg-gray-100 text-gray-600 rounded-full">${bookGrade(b)}</span>` : ''}
                 <span class="px-2 py-1 text-xs font-semibold bg-blue-100 text-blue-700 rounded-full">${catLabels[b.category] || b.category}</span>`;

            document.getElementById('book-modal').classList.add('open');
            refreshOfflineButton(b.id);
        }

        // ── Guardar offline (IndexedDB, para a aba Transferências) ──
        async function refreshOfflineButton(id) {
            const btn = document.getElementById('modal-offline-btn');
            const saved = await VClassOffline.isSaved(id);
            btn.innerHTML = saved
                ? `<i class="fas fa-check-circle mr-2 text-green-600"></i>Guardado offline`
                : `<i class="fas fa-box-archive mr-2"></i>Guardar offline (para acesso sem internet)`;
            btn.classList.toggle('bg-green-50', saved);
            btn.classList.toggle('text-green-700', saved);
            btn.classList.toggle('bg-gray-100', !saved);
            btn.classList.toggle('text-gray-700', !saved);
        }

        // Guarda o blob do ficheiro no IndexedDB (partilhado por "Guardar offline" e "Descarregar").
        // Não faz nada se já estiver guardado.
        async function _ensureSavedOffline(b) {
            if (await VClassOffline.isSaved(b.id)) return;
            if (!b.file_url) throw new Error('Ficheiro ainda não disponível para download');
            await VClassOffline.saveItem({
                id: b.id,
                type: 'book',
                title: b.title,
                cover_url: b.cover_url || null,
                file_url: b.file_url,
                file_size_kb: b.file_size_kb
            });
        }

        function fileExt(url) {
            const m = /\.([a-z0-9]+)(?:\?.*)?$/i.exec(url || '');
            return m ? m[1] : 'pdf';
        }

        async function saveOffline() {
            const b = activeBook;
            if (!b) return;
            if (await VClassOffline.isSaved(b.id)) {
                VClass.showNotification('Este material já está guardado offline', 'info');
                return;
            }
            const btn = document.getElementById('modal-offline-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>A guardar...`;
            try {
                await _ensureSavedOffline(b);
                VClass.showNotification('Guardado! Disponível em Transferências.', 'success');
            } catch (e) {
                VClass.showNotification(e.message || 'Erro ao guardar offline', 'error');
            } finally {
                btn.disabled = false;
                refreshOfflineButton(b.id);
            }
        }

        function closeModal() {
            document.getElementById('book-modal').classList.remove('open');
            activeBook = null;
        }

        // ── Visualizar PDF ─────────────────────────────────────────
        function viewBook(id) {
            const b = id ? ALL_BOOKS.find(x => x.id === id) : activeBook;
            if (!b) return;
            if (b.file_url) {
                window.open(b.file_url, '_blank', 'noopener');
            } else {
                VClass.showNotification('Ficheiro ainda não disponível', 'warning');
            }
        }

        // ── Descarregar ──────────────────────────────────────────────
        // Guarda o ficheiro em Transferências (IndexedDB) e entrega-o ao SO a partir
        // de um blob: URL — file_url aponta para o Supabase Storage (outra origem), e
        // o browser ignora silenciosamente o atributo "download" em links cross-origin.
        async function downloadBook(id) {
            const b = id ? ALL_BOOKS.find(x => x.id === id) : activeBook;
            if (!b) return;
            if (!b.file_url) {
                VClass.showNotification('Ficheiro ainda não disponível para download', 'warning');
                return;
            }

            // Incrementar contador (fire-and-forget)
            fetch(`/api/library/${b.id}/download`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` }
            }).then(() => {
                const idx = ALL_BOOKS.findIndex(x => x.id === b.id);
                if (idx !== -1) ALL_BOOKS[idx].downloads_count = (ALL_BOOKS[idx].downloads_count || 0) + 1;
            }).catch(() => {});

            VClass.showNotification(`A descarregar "${b.title}"...`, 'info');
            try {
                await _ensureSavedOffline(b);
                const blobUrl = await VClassOffline.getBlobUrl(b.id);
                const a = document.createElement('a');
                a.href     = blobUrl;
                a.download = `${b.title}.${fileExt(b.file_url)}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                VClass.showNotification(`"${b.title}" guardado em Transferências.`, 'success');
                if (activeBook && activeBook.id === b.id) refreshOfflineButton(b.id);
            } catch (e) {
                // Falha a guardar offline (ex: CORS no storage) — pelo menos abre o ficheiro
                window.open(b.file_url, '_blank', 'noopener');
                VClass.showNotification('Não foi possível guardar offline — a abrir o ficheiro.', 'warning');
            }
        }

        // Fechar modal clicando fora
        document.getElementById('book-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ── Carregar filtros (disciplinas e classes) da API ────────
        async function loadFilterOptions() {
            try {
                // Carregar subjects a partir dos livros já na memória
                const subjects = {};
                const grades   = {};
                ALL_BOOKS.forEach(b => {
                    if (b.subjects?.id) subjects[b.subjects.id] = b.subjects.name;
                    if (b.grades?.id)   grades[b.grades.id]     = b.grades.name;
                });

                const subSel = document.getElementById('subject-filter');
                const grdSel = document.getElementById('grade-filter');

                if (Object.keys(subjects).length) {
                    subSel.innerHTML = '<option value="">Todas as Disciplinas</option>' +
                        Object.entries(subjects)
                            .sort((a, b) => a[1].localeCompare(b[1]))
                            .map(([id, name]) => `<option value="${id}">${name}</option>`).join('');
                }
                if (Object.keys(grades).length) {
                    grdSel.innerHTML = '<option value="">Todas as Classes</option>' +
                        Object.entries(grades)
                            .sort((a, b) => a[1].localeCompare(b[1], 'pt', { numeric: true }))
                            .map(([id, name]) => `<option value="${id}">${name}</option>`).join('');
                }
            } catch (e) { console.warn('loadFilterOptions:', e); }
        }

        // ── Carregar livros da API ─────────────────────────────────
        async function loadLibrary() {
            // Mostrar skeleton
            document.getElementById('books-grid').innerHTML =
                Array(8).fill('<div class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="h-48 bg-gray-200 animate-pulse"></div><div class="p-4 space-y-2"><div class="h-3 bg-gray-200 rounded animate-pulse"></div><div class="h-3 bg-gray-200 rounded animate-pulse w-3/4"></div></div></div>').join('');

            try {
                const res  = await fetch('/api/library?limit=100', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const json = await res.json();

                if (!json.success) throw new Error(json.error || 'Erro na API');

                ALL_BOOKS = json.data?.books || [];
                updateStats(ALL_BOOKS);
                await loadFilterOptions();
                applyFilters();
            } catch (e) {
                console.warn('Library API error:', e);
                document.getElementById('books-grid').innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('empty-state').querySelector('p').textContent =
                    'Não foi possível carregar a biblioteca. Tenta mais tarde.';
            }
        }

        // ── Init ───────────────────────────────────────────────────
        loadLibrary();
    </script>
</body>
</html>
