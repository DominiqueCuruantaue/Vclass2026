<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcadores - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .lesson-card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .lesson-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.10); }
        .bookmark-chip { transition: all 0.15s ease; }
        .bookmark-chip:hover { background: #dbeafe; }
        #empty-state { display: none; }
    </style>
  <script src="/static/safe-dom.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="navbar-placeholder" style="min-height:64px"></div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-700 to-indigo-600 text-white py-10">
        <div class="container mx-auto px-6">
            <h1 class="text-3xl md:text-4xl font-bold flex items-center gap-3">
                <i class="fas fa-bookmark"></i> Marcadores
            </h1>
            <p class="text-purple-200 mt-1 text-sm">Aulas favoritadas e pontos marcados nos vídeos</p>
        </div>
    </div>

    <div class="container mx-auto px-6 py-8 max-w-5xl">
        <div id="lessons-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div id="empty-state" class="text-center py-20">
            <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-bookmark text-gray-300 text-2xl"></i>
            </div>
            <p class="text-gray-500 font-medium mb-1">Ainda não tens marcadores</p>
            <p class="text-gray-400 text-sm mb-4">Favorita uma aula ou marca um ponto no vídeo para veres aqui</p>
            <a href="/browse.html" class="inline-block px-4 py-2 bg-purple-600 text-white rounded-xl text-sm font-semibold hover:bg-purple-700 transition">
                <i class="fas fa-book mr-1.5"></i>Explorar Conteúdo
            </a>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        VClass.initNavbar('bookmarks');

        function formatChipTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function loadMarkedLessons() {
            const [favRes, bmRes] = await Promise.all([
                VClass.api.favorites.list(),
                VClass.api.bookmarks.listAll()
            ]);

            const byLesson = new Map();

            const ensure = (lesson, lessonId) => {
                if (!byLesson.has(lessonId)) {
                    byLesson.set(lessonId, { lesson, favorited: false, bookmarks: [] });
                }
                return byLesson.get(lessonId);
            };

            if (favRes.success) {
                (favRes.data || []).forEach(f => {
                    if (!f.lessons) return;
                    ensure(f.lessons, f.lesson_id).favorited = true;
                });
            }

            if (bmRes.success) {
                (bmRes.data || []).forEach(b => {
                    if (!b.lessons) return;
                    ensure(b.lessons, b.lesson_id).bookmarks.push(b);
                });
            }

            renderLessons([...byLesson.values()]);
        }

        function renderLessons(entries) {
            const grid = document.getElementById('lessons-grid');
            const empty = document.getElementById('empty-state');

            if (entries.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            grid.innerHTML = entries.map((entry, i) => {
                const lesson  = entry.lesson;
                const subject = lesson.chapters?.grade_subjects?.subjects;
                const color   = subject?.color || '#7c3aed';

                const chips = entry.bookmarks
                    .sort((a, b) => a.time_seconds - b.time_seconds)
                    .map(b => `
                        <button onclick="window.location.href='/lesson.html?id=${lesson.id}&t=${b.time_seconds}'"
                            class="bookmark-chip flex items-center gap-1.5 px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-semibold">
                            <i class="fas fa-play text-[10px]"></i> ${formatChipTime(b.time_seconds)} — ${escapeHtml(b.title || 'Marcador')}
                        </button>`).join('');

                return `
                <div class="lesson-card bg-white rounded-2xl shadow-sm border border-gray-100 p-5" style="animation-delay:${Math.min(i * 0.05, 0.4)}s">
                    <div class="flex items-start justify-between gap-3 mb-2">
                        <div class="min-w-0 cursor-pointer" onclick="window.location.href='/lesson.html?id=${lesson.id}'">
                            ${subject ? `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full mb-1.5" style="background:${escapeAttr(color)}22; color:${escapeAttr(color)}">${escapeHtml(subject.name)}</span>` : ''}
                            <p class="font-semibold text-gray-900 text-sm truncate">${escapeHtml(lesson.title)}</p>
                            ${lesson.chapters?.title ? `<p class="text-xs text-gray-400 truncate">${escapeHtml(lesson.chapters.title)}</p>` : ''}
                        </div>
                        ${entry.favorited ? `<i class="fas fa-heart text-red-500 flex-shrink-0" title="Favoritado"></i>` : ''}
                    </div>
                    ${chips ? `<div class="flex flex-wrap gap-1.5 mt-3">${chips}</div>` : `<p class="text-xs text-gray-400 mt-2">Sem marcadores de tempo nesta aula</p>`}
                </div>`;
            }).join('');
        }

        loadMarkedLessons();
    </script>
</body>
</html>
