<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Conteúdo - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        .subject-icon-wrapper {
            position: relative;
            overflow: hidden;
        }
        .subject-icon-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: rotate(45deg);
        }
        .grade-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.125rem;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .country-card {
            position: relative;
            overflow: hidden;
        }
        .country-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .country-card:hover::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </a>
                    <div class="hidden md:flex space-x-4">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-md text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-book mr-1"></i> Conteúdo
                        </a>
                        <a href="/my-progress.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-sm text-gray-700"></span>
                    <button onclick="VClass.logout()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Breadcrumb -->
        <nav class="flex mb-6" aria-label="Breadcrumb">
            <ol id="breadcrumb" class="inline-flex items-center space-x-1 md:space-x-3">
                <li class="inline-flex items-center">
                    <a href="/browse.html" class="text-gray-700 hover:text-purple-600">
                        <i class="fas fa-home mr-1"></i> Início
                    </a>
                </li>
            </ol>
        </nav>

        <!-- Header -->
        <div class="mb-8">
            <h1 id="page-title" class="text-4xl font-bold text-gray-900 mb-2">
                <i class="fas fa-compass text-purple-600 mr-3"></i>Explorar Conteúdo
            </h1>
            <p id="page-subtitle" class="text-lg text-gray-600">
                Selecione o país e série para começar sua jornada de aprendizado
            </p>
        </div>

        <!-- Content Container -->
        <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
            <!-- Loading -->
            <div class="bg-white p-6 rounded-xl shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-20 bg-gray-200 rounded"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-20 bg-gray-200 rounded"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-20 bg-gray-200 rounded"></div>
            </div>
        </div>

        <!-- Back Button -->
        <div id="back-button-container" class="mt-8" style="display: none;">
            <button onclick="goBack()" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-gray-500 to-gray-600 text-white rounded-lg hover:from-gray-600 hover:to-gray-700 transition shadow-md">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </button>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // DEMO MODE: Set fake authentication for testing content
        const isDemoMode = true; // Set to false to require login
        
        if (isDemoMode && !VClass.isAuthenticated()) {
            // Set demo token to bypass auth checks
            localStorage.setItem('accessToken', 'demo_token');
            localStorage.setItem('user', JSON.stringify({
                id: 'demo',
                email: 'demo@vclass.mz',
                full_name: 'Demo User',
                role: 'student'
            }));
        } else if (!isDemoMode && !VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = VClass.getCurrentUser();
        if (user) {
            document.getElementById('user-name').textContent = user.full_name;
        }

        // Navigation state
        const nav = {
            history: [],
            current: 'countries'
        };

        // Load initial content (countries)
        async function init() {
            loadCountries();
        }

        // Load countries
        async function loadCountries() {
            nav.current = 'countries';
            updateBreadcrumb(['Países']);
            updateHeader('Selecionar País', 'Escolha o país do sistema educacional');
            document.getElementById('back-button-container').style.display = 'none';

            try {
                const result = await VClass.api.content.getCountries();
                
                if (result.success) {
                    renderCountries(result.data);
                }
            } catch (error) {
                console.error('Error loading countries:', error);
            }
        }

        function renderCountries(countries) {
            const container = document.getElementById('content-container');
            
            container.innerHTML = countries.map(country => `
                <div class="country-card bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition cursor-pointer card-hover"
                     onclick="selectCountry('${country.id}', '${country.name}')">
                    <div class="flex flex-col items-center text-center">
                        <div class="text-6xl mb-4">${country.flag_url || '🌍'}</div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">${country.name}</h3>
                        <p class="text-sm text-gray-600 uppercase tracking-wider font-semibold">${country.code}</p>
                        <div class="mt-4 text-purple-600">
                            <i class="fas fa-arrow-right text-xl"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Select country and load education systems (then grades)
        async function selectCountry(countryId, countryName) {
            nav.history.push({type: 'countries', countryId, countryName});
            nav.current = 'grades';
            
            updateBreadcrumb(['Países', countryName]);
            updateHeader(`${countryName} - Séries`, 'Escolha a série/ano');
            document.getElementById('back-button-container').style.display = 'block';

            try {
                // Get education systems for this country
                const eduSystemResult = await VClass.api.content.getEducationSystems(countryId);
                
                if (eduSystemResult.success && eduSystemResult.data.length > 0) {
                    // Get grades for first education system
                    const eduSystemId = eduSystemResult.data[0].id;
                    const gradesResult = await VClass.api.content.getGrades(eduSystemId);
                    
                    if (gradesResult.success) {
                        renderGrades(gradesResult.data, countryName);
                    }
                } else {
                    showMessage('warning', 'Nenhum sistema educacional encontrado', 'Este país ainda não possui séries cadastradas.');
                }
            } catch (error) {
                console.error('Error loading grades:', error);
                showMessage('error', 'Erro ao carregar séries', error.message || 'Tente novamente mais tarde');
            }
        }

        function renderGrades(grades, countryName) {
            const container = document.getElementById('content-container');
            
            // Grade level colors
            const getLevelColor = (level) => {
                if (level <= 5) return { bg: 'bg-blue-500', badge: 'bg-blue-100 text-blue-700' };
                if (level <= 9) return { bg: 'bg-green-500', badge: 'bg-green-100 text-green-700' };
                return { bg: 'bg-purple-500', badge: 'bg-purple-100 text-purple-700' };
            };

            container.innerHTML = grades.map(grade => {
                const colors = getLevelColor(grade.level);
                return `
                    <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition cursor-pointer card-hover"
                         onclick="selectGrade('${grade.id}', '${grade.name}', '${countryName}')">
                        <div class="flex items-center justify-between mb-4">
                            <div class="grade-badge ${colors.badge}">
                                ${grade.level}
                            </div>
                            <div class="w-10 h-10 ${colors.bg} bg-opacity-20 rounded-full flex items-center justify-center">
                                <i class="fas fa-arrow-right text-${colors.bg.replace('bg-', '')}"></i>
                            </div>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">${grade.name}</h3>
                        <p class="text-sm text-gray-600">${grade.description || 'Clique para ver disciplinas'}</p>
                    </div>
                `;
            }).join('');
        }

        // Select grade and load subjects
        async function selectGrade(gradeId, gradeName, countryName) {
            nav.history.push({type: 'grades', gradeId, gradeName, countryName});
            nav.current = 'subjects';
            
            updateBreadcrumb(['Países', countryName, gradeName]);
            updateHeader(`${gradeName} - Disciplinas`, 'Escolha a disciplina para começar a estudar');

            try {
                const result = await VClass.api.content.getSubjects(gradeId);
                
                if (result.success) {
                    renderSubjects(result.data, gradeId, gradeName, countryName);
                }
            } catch (error) {
                console.error('Error loading subjects:', error);
                showMessage('error', 'Erro ao carregar disciplinas', error.message || 'Tente novamente');
            }
        }

        function renderSubjects(subjects, gradeId, gradeName, countryName) {
            const container = document.getElementById('content-container');
            
            container.innerHTML = subjects.map(subject => `
                <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition cursor-pointer card-hover"
                     onclick="selectSubject('${subject.grade_subject_id}', '${subject.name}', '${gradeName}', '${countryName}')">
                    <div class="flex items-center justify-between mb-4">
                        <div class="subject-icon-wrapper w-16 h-16 rounded-xl flex items-center justify-center" 
                             style="background: linear-gradient(135deg, ${subject.color}20 0%, ${subject.color}40 100%)">
                            <i class="fas fa-${getSubjectIcon(subject.name)} text-3xl" style="color: ${subject.color}"></i>
                        </div>
                        <div class="text-right">
                            <i class="fas fa-arrow-right text-2xl text-gray-400"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">${subject.name}</h3>
                    <p class="text-sm text-gray-600 mb-3">${subject.description || 'Ver capítulos e lições'}</p>
                    <div class="flex items-center space-x-4 text-xs text-gray-500">
                        <span><i class="fas fa-book mr-1"></i>Capítulos</span>
                        <span><i class="fas fa-video mr-1"></i>Vídeos</span>
                        <span><i class="fas fa-tasks mr-1"></i>Exercícios</span>
                    </div>
                </div>
            `).join('');
        }

        // Get icon for subject
        function getSubjectIcon(subjectName) {
            const icons = {
                'Matemática': 'calculator',
                'Português': 'book-open',
                'Física': 'atom',
                'Química': 'flask',
                'Biologia': 'leaf',
                'História': 'landmark',
                'Geografia': 'globe-americas',
                'Inglês': 'language',
                'Francês': 'language',
                'Educação Física': 'running',
                'Artes': 'palette',
                'Informática': 'laptop-code'
            };
            return icons[subjectName] || 'book';
        }

        // Select subject and navigate to chapters page
        function selectSubject(gradeSubjectId, subjectName, gradeName, countryName) {
            window.location.href = `/chapters.html?gs=${gradeSubjectId}&subject=${encodeURIComponent(subjectName)}&grade=${encodeURIComponent(gradeName)}&country=${encodeURIComponent(countryName)}`;
        }

        // Go back
        function goBack() {
            if (nav.history.length > 0) {
                const prev = nav.history.pop();
                
                if (prev.type === 'countries') {
                    loadCountries();
                } else if (prev.type === 'grades') {
                    selectCountry(prev.countryId, prev.countryName);
                }
            }
        }

        // Update breadcrumb
        function updateBreadcrumb(items) {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = items.map((item, index) => {
                if (index === 0) {
                    return `
                        <li class="inline-flex items-center">
                            <a href="/browse.html" class="text-gray-700 hover:text-purple-600">
                                <i class="fas fa-home mr-1"></i> ${item}
                            </a>
                        </li>
                    `;
                }
                return `
                    <li>
                        <div class="flex items-center">
                            <i class="fas fa-chevron-right text-gray-400 mx-2"></i>
                            <span class="text-gray-700">${item}</span>
                        </div>
                    </li>
                `;
            }).join('');
        }

        // Update header
        function updateHeader(title, subtitle) {
            document.getElementById('page-title').innerHTML = `<i class="fas fa-compass text-purple-600 mr-3"></i>${title}`;
            document.getElementById('page-subtitle').textContent = subtitle;
        }

        // Show message
        function showMessage(type, title, message) {
            const icons = {
                warning: 'exclamation-triangle',
                error: 'exclamation-circle'
            };
            const colors = {
                warning: 'yellow',
                error: 'red'
            };
            const color = colors[type] || 'gray';
            const icon = icons[type] || 'info-circle';

            const container = document.getElementById('content-container');
            container.innerHTML = `
                <div class="col-span-full">
                    <div class="bg-${color}-50 border border-${color}-200 rounded-xl p-12 text-center">
                        <i class="fas fa-${icon} text-6xl text-${color}-400 mb-4"></i>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">${title}</h3>
                        <p class="text-gray-600">${message}</p>
                    </div>
                </div>
            `;
        }

        // Initialize
        init();
    </script>
</body>
</html>
