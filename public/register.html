<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo -->
            <div class="text-center">
                <div class="flex items-center justify-center space-x-2 mb-4">
                    <i class="fas fa-graduation-cap text-5xl text-purple-600"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-gray-900">
                    Criar Conta
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Junte-se à comunidade VClass
                </p>
            </div>

            <!-- Alert Container -->
            <div id="alert-container"></div>

            <!-- Register Form -->
            <form id="register-form" class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow-md">
                <div class="space-y-4">
                    <div>
                        <label for="full_name" class="block text-sm font-medium text-gray-700">
                            Nome Completo
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input 
                                id="full_name" 
                                name="full_name" 
                                type="text" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="João Silva"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">
                            Email
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input 
                                id="email" 
                                name="email" 
                                type="email" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="seu@email.com"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700">
                            Telefone (Opcional)
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-phone text-gray-400"></i>
                            </div>
                            <input 
                                id="phone" 
                                name="phone" 
                                type="tel" 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="+258 84 123 4567"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Senha
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input 
                                id="password" 
                                name="password" 
                                type="password" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="••••••••"
                            >
                        </div>
                        <p class="mt-1 text-xs text-gray-500">
                            Mínimo 8 caracteres, com maiúscula, minúscula e número
                        </p>
                    </div>

                    <div>
                        <label for="confirm_password" class="block text-sm font-medium text-gray-700">
                            Confirmar Senha
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input 
                                id="confirm_password" 
                                name="confirm_password" 
                                type="password" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="••••••••"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700">
                            Eu sou um(a)
                        </label>
                        <select 
                            id="role" 
                            name="role" 
                            required
                            class="mt-1 block w-full pl-3 pr-10 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                        >
                            <option value="student">Estudante</option>
                            <option value="teacher">Professor(a)</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center">
                    <input 
                        id="terms" 
                        name="terms" 
                        type="checkbox" 
                        required
                        class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
                    >
                    <label for="terms" class="ml-2 block text-sm text-gray-900">
                        Concordo com os <a href="#" class="text-purple-600 hover:text-purple-500">Termos de Uso</a>
                    </label>
                </div>

                <div>
                    <button 
                        type="submit" 
                        id="register-btn"
                        class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition"
                    >
                        <i class="fas fa-user-plus mr-2"></i>
                        Criar Conta
                    </button>
                </div>

                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        Já tem uma conta?
                        <a href="/login.html" class="font-medium text-purple-600 hover:text-purple-500">
                            Entrar
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        const registerForm = document.getElementById('register-form');
        const registerBtn = document.getElementById('register-btn');
        const alertContainer = document.getElementById('alert-container');

        // Show alert
        function showAlert(message, type = 'error') {
            const colors = {
                error: 'bg-red-50 border-red-200 text-red-800',
                success: 'bg-green-50 border-green-200 text-green-800',
                info: 'bg-blue-50 border-blue-200 text-blue-800'
            };

            alertContainer.innerHTML = `
                <div class="${colors[type]} border rounded-lg p-4 mb-4 fade-in">
                    <div class="flex items-center">
                        <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'} mr-2"></i>
                        <span>${message}</span>
                    </div>
                </div>
            `;
        }

        // Handle registration
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const full_name = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const role = document.getElementById('role').value;

            // Validate password match
            if (password !== confirm_password) {
                showAlert('As senhas não coincidem', 'error');
                return;
            }

            // Validate password strength
            if (password.length < 8) {
                showAlert('A senha deve ter no mínimo 8 caracteres', 'error');
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showAlert('A senha deve conter pelo menos uma letra maiúscula', 'error');
                return;
            }

            if (!/[a-z]/.test(password)) {
                showAlert('A senha deve conter pelo menos uma letra minúscula', 'error');
                return;
            }

            if (!/[0-9]/.test(password)) {
                showAlert('A senha deve conter pelo menos um número', 'error');
                return;
            }

            // Show loading
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Criando conta...';

            try {
                const result = await VClass.api.auth.register({
                    email,
                    password,
                    full_name,
                    role,
                    phone: phone || undefined
                });

                if (result.success) {
                    // Save auth data
                    VClass.saveAuth(result.data);

                    // Show success
                    showAlert('Conta criada com sucesso!', 'success');

                    // Redirect
                    setTimeout(() => {
                        if (role === 'student') {
                            window.location.href = '/dashboard.html';
                        } else {
                            window.location.href = '/teacher-dashboard.html';
                        }
                    }, 1500);
                } else {
                    showAlert(result.error || 'Erro ao criar conta', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Criar Conta';
                }
            } catch (error) {
                console.error('Register error:', error);
                showAlert('Erro de conexão. Verifique sua internet.', 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Criar Conta';
            }
        });

        // Check if already logged in
        if (VClass.isAuthenticated()) {
            const user = VClass.getCurrentUser();
            if (user) {
                if (user.role === 'student') {
                    window.location.href = '/dashboard.html';
                } else {
                    window.location.href = '/teacher-dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
