<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </div>
                    <div class="hidden md:flex space-x-4">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-book mr-1"></i> Conteúdo
                        </a>
                        <a href="/progress.html" class="px-3 py-2 rounded-md text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-sm text-gray-700"></span>
                    <button onclick="VClass.logout()" class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-sign-out-alt mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                <i class="fas fa-chart-line text-purple-600 mr-2"></i>
                Meu Progresso
            </h1>
            <p class="text-gray-600">Acompanhe seu desenvolvimento em todas as disciplinas</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-4"></i>
            <p class="text-gray-600">Carregando progresso...</p>
        </div>

        <!-- Stats Overview -->
        <div id="stats-container" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 hidden">
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Total de Aulas</p>
                        <p id="total-lessons" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-video text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Aulas Concluídas</p>
                        <p id="completed-lessons" class="text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Exercícios Feitos</p>
                        <p id="total-exercises" class="text-3xl font-bold text-purple-600">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-tasks text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Pontuação Média</p>
                        <p id="avg-score" class="text-3xl font-bold text-orange-600">0%</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-star text-orange-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress by Subject -->
        <div id="subjects-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8 hidden">
            <!-- Will be populated dynamically -->
        </div>

        <!-- Progress Chart -->
        <div class="bg-white p-6 rounded-lg shadow-sm mb-8 hidden" id="chart-container">
            <h2 class="text-xl font-bold text-gray-900 mb-4">
                <i class="fas fa-chart-bar mr-2"></i>
                Progresso Semanal
            </h2>
            <canvas id="progressChart" height="80"></canvas>
        </div>

        <!-- Recent Activity -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden hidden" id="activity-container">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-900">
                    <i class="fas fa-history mr-2"></i>
                    Atividade Recente
                </h2>
            </div>
            <div id="activity-list" class="divide-y divide-gray-200">
                <!-- Will be populated dynamically -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Check authentication
        if (!VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = VClass.getCurrentUser();
        if (user) {
            document.getElementById('user-name').textContent = user.name;
        }

        // Load progress data
        async function loadProgress() {
            try {
                const result = await VClass.api.progress.getDashboard();

                if (result.success) {
                    const data = result.data;
                    
                    // Update stats
                    document.getElementById('total-lessons').textContent = data.stats.totalLessons || 0;
                    document.getElementById('completed-lessons').textContent = data.stats.completedLessons || 0;
                    document.getElementById('total-exercises').textContent = data.stats.totalExercises || 0;
                    document.getElementById('avg-score').textContent = Math.round(data.stats.averageScore || 0) + '%';

                    // Show stats container
                    document.getElementById('stats-container').classList.remove('hidden');

                    // Populate subjects
                    if (data.subjectProgress && data.subjectProgress.length > 0) {
                        populateSubjects(data.subjectProgress);
                        document.getElementById('subjects-container').classList.remove('hidden');
                    }

                    // Populate recent activity
                    if (data.recentActivity && data.recentActivity.length > 0) {
                        populateActivity(data.recentActivity);
                        document.getElementById('activity-container').classList.remove('hidden');
                    }

                    // Create chart (mock data for now)
                    createProgressChart();
                    document.getElementById('chart-container').classList.remove('hidden');

                    // Hide loading
                    document.getElementById('loading').classList.add('hidden');
                } else {
                    VClass.showNotification(result.error || 'Erro ao carregar progresso', 'error');
                }
            } catch (error) {
                console.error('Error loading progress:', error);
                VClass.showNotification('Erro ao carregar dados', 'error');
            }
        }

        function populateSubjects(subjects) {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';

            subjects.forEach(subject => {
                const progress = Math.round((subject.completed_lessons / subject.total_lessons) * 100) || 0;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-lg shadow-sm';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-gray-900">${subject.subject_name}</h3>
                        <span class="text-2xl font-bold text-purple-600">${progress}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 mb-4">
                        <div class="bg-purple-600 h-3 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p class="text-gray-600">Aulas Concluídas</p>
                            <p class="font-bold text-gray-900">${subject.completed_lessons} / ${subject.total_lessons}</p>
                        </div>
                        <div>
                            <p class="text-gray-600">Tempo Total</p>
                            <p class="font-bold text-gray-900">${formatTime(subject.total_watch_time)}</p>
                        </div>
                    </div>
                    ${subject.average_score ? `
                        <div class="mt-4 pt-4 border-t border-gray-200">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-gray-600">Pontuação Média</span>
                                <span class="text-sm font-bold ${getScoreColor(subject.average_score)}">${Math.round(subject.average_score)}%</span>
                            </div>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        function populateActivity(activities) {
            const container = document.getElementById('activity-list');
            container.innerHTML = '';

            activities.forEach(activity => {
                const item = document.createElement('div');
                item.className = 'p-4 hover:bg-gray-50 transition';
                item.innerHTML = `
                    <div class="flex items-start">
                        <div class="flex-shrink-0">
                            <div class="w-10 h-10 rounded-full ${getActivityBg(activity.type)} flex items-center justify-center">
                                <i class="${getActivityIcon(activity.type)} ${getActivityColor(activity.type)}"></i>
                            </div>
                        </div>
                        <div class="ml-4 flex-1">
                            <p class="text-sm font-medium text-gray-900">${activity.title}</p>
                            <p class="text-sm text-gray-600">${activity.description}</p>
                            <p class="text-xs text-gray-500 mt-1">${formatDate(activity.created_at)}</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function createProgressChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            // Mock data - replace with real data
            const labels = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
            const data = [2, 3, 1, 4, 3, 5, 2];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Aulas Assistidas',
                        data: data,
                        borderColor: 'rgb(147, 51, 234)',
                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        function formatTime(seconds) {
            if (!seconds) return '0min';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            if (hours > 0) {
                return `${hours}h ${minutes}min`;
            }
            return `${minutes}min`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (hours < 1) return 'Agora';
            if (hours < 24) return `Há ${hours}h`;
            if (days < 7) return `Há ${days}d`;
            return date.toLocaleDateString('pt-BR');
        }

        function getScoreColor(score) {
            if (score >= 80) return 'text-green-600';
            if (score >= 60) return 'text-yellow-600';
            return 'text-red-600';
        }

        function getActivityIcon(type) {
            switch(type) {
                case 'lesson_completed': return 'fas fa-check-circle';
                case 'exercise_submitted': return 'fas fa-tasks';
                case 'video_watched': return 'fas fa-video';
                default: return 'fas fa-circle';
            }
        }

        function getActivityBg(type) {
            switch(type) {
                case 'lesson_completed': return 'bg-green-100';
                case 'exercise_submitted': return 'bg-purple-100';
                case 'video_watched': return 'bg-blue-100';
                default: return 'bg-gray-100';
            }
        }

        function getActivityColor(type) {
            switch(type) {
                case 'lesson_completed': return 'text-green-600';
                case 'exercise_submitted': return 'text-purple-600';
                case 'video_watched': return 'text-blue-600';
                default: return 'text-gray-600';
            }
        }

        // Load data on page load
        loadProgress();
    </script>
</body>
</html>
