<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .subject-card { transition: all 0.2s; }
        .subject-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .progress-fill { transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
        .period-btn { transition: all 0.2s; }
        .period-btn.active { background: #7c3aed; color: white; box-shadow: 0 2px 8px rgba(124,58,237,0.3); }
        .tab-btn { transition: all 0.2s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #7c3aed; border-bottom-color: #7c3aed; }
        .rank-badge { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeInUp 0.4s ease forwards; }
        .circular-progress { transform: rotate(-90deg); }
        .score-pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="navbar-placeholder"></div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-600 to-indigo-700 text-white">
        <div class="container mx-auto px-4 py-8 max-w-7xl">
            <h1 class="text-3xl font-bold mb-1">
                <i class="fas fa-chart-line mr-3"></i>Meu Progresso
            </h1>
            <p class="text-purple-200">Acompanhe seu desenvolvimento em todas as disciplinas</p>
            <!-- Period Selector -->
            <div class="flex space-x-2 mt-5">
                <button onclick="setPeriod('week')" id="period-week" class="period-btn active px-4 py-2 rounded-lg text-sm font-medium bg-white text-purple-600">Esta semana</button>
                <button onclick="setPeriod('month')" id="period-month" class="period-btn px-4 py-2 rounded-lg text-sm font-medium bg-white/20 text-white hover:bg-white/30">Este mês</button>
                <button onclick="setPeriod('all')" id="period-all" class="period-btn px-4 py-2 rounded-lg text-sm font-medium bg-white/20 text-white hover:bg-white/30">Todo período</button>
            </div>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="bg-white border-b border-gray-100 shadow-sm">
        <div class="container mx-auto px-4 max-w-7xl">
            <div id="stats-container" class="grid grid-cols-2 md:grid-cols-4 divide-x divide-gray-100">
                <!-- Loading -->
                <div class="p-6 animate-pulse"><div class="h-3 bg-gray-200 rounded mb-3 w-2/3"></div><div class="h-8 bg-gray-200 rounded w-1/2"></div></div>
                <div class="p-6 animate-pulse"><div class="h-3 bg-gray-200 rounded mb-3 w-2/3"></div><div class="h-8 bg-gray-200 rounded w-1/2"></div></div>
                <div class="p-6 animate-pulse"><div class="h-3 bg-gray-200 rounded mb-3 w-2/3"></div><div class="h-8 bg-gray-200 rounded w-1/2"></div></div>
                <div class="p-6 animate-pulse"><div class="h-3 bg-gray-200 rounded mb-3 w-2/3"></div><div class="h-8 bg-gray-200 rounded w-1/2"></div></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-7xl">

        <!-- Chart + Subjects grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">

            <!-- Main Chart -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-3">
                    <h2 class="text-lg font-bold text-gray-900">
                        <i class="fas fa-chart-area text-purple-600 mr-2"></i>
                        Atividade de Estudo
                    </h2>
                    <div class="flex space-x-1 bg-gray-100 rounded-lg p-1">
                        <button onclick="switchChartType('lessons')" id="ct-lessons" class="chart-type-btn px-3 py-1.5 text-xs font-medium rounded-md bg-white shadow-sm text-gray-900">Aulas</button>
                        <button onclick="switchChartType('time')" id="ct-time" class="chart-type-btn px-3 py-1.5 text-xs font-medium rounded-md text-gray-500">Tempo</button>
                        <button onclick="switchChartType('score')" id="ct-score" class="chart-type-btn px-3 py-1.5 text-xs font-medium rounded-md text-gray-500">Pontuação</button>
                    </div>
                </div>
                <canvas id="mainChart" height="140"></canvas>
            </div>

            <!-- Overall Progress Ring -->
            <div class="bg-white rounded-2xl shadow-sm p-6 flex flex-col items-center justify-center text-center">
                <h3 class="text-lg font-bold text-gray-900 mb-4">Progresso Geral</h3>
                <div class="relative w-40 h-40 mb-4">
                    <svg class="circular-progress" width="160" height="160" viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r="65" fill="none" stroke="#f3f4f6" stroke-width="14"/>
                        <circle id="overall-ring" cx="80" cy="80" r="65" fill="none" stroke="#7c3aed" stroke-width="14"
                            stroke-dasharray="408.41" stroke-dashoffset="408.41"
                            stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="overall-pct" class="text-4xl font-bold text-gray-900">0%</span>
                        <span class="text-xs text-gray-500">concluído</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 w-full">
                    <div class="bg-purple-50 rounded-xl p-3">
                        <p class="text-xl font-bold text-purple-600" id="ring-completed">0</p>
                        <p class="text-xs text-gray-500">Concluídas</p>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-3">
                        <p class="text-xl font-bold text-gray-600" id="ring-total">0</p>
                        <p class="text-xs text-gray-500">Total</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs: Disciplinas / Atividade -->
        <div class="border-b border-gray-200 mb-6">
            <div class="flex space-x-6">
                <button onclick="switchTab('subjects')" id="tab-subjects" class="tab-btn active py-3 text-sm font-semibold">
                    <i class="fas fa-book mr-2"></i>Por Disciplina
                </button>
                <button onclick="switchTab('activity')" id="tab-activity" class="tab-btn py-3 text-sm font-semibold text-gray-500">
                    <i class="fas fa-history mr-2"></i>Atividade Recente
                </button>
                <button onclick="switchTab('exercises')" id="tab-exercises" class="tab-btn py-3 text-sm font-semibold text-gray-500">
                    <i class="fas fa-tasks mr-2"></i>Exercícios
                </button>
            </div>
        </div>

        <!-- Tab Contents -->
        <div id="subjects-content">
            <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                <div class="animate-pulse bg-white rounded-2xl p-6 h-40"></div>
                <div class="animate-pulse bg-white rounded-2xl p-6 h-40"></div>
                <div class="animate-pulse bg-white rounded-2xl p-6 h-40"></div>
            </div>
        </div>

        <div id="activity-content" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div id="activity-list" class="divide-y divide-gray-100">
                    <div class="p-8 text-center text-gray-400">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3 block text-purple-400"></i>
                        <p>Carregando atividades...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="exercises-content" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="exercises-list">
                <div class="bg-white rounded-2xl shadow-sm p-6 text-center text-gray-400">
                    <i class="fas fa-tasks text-3xl mb-3 block text-blue-400"></i>
                    <p>Nenhum exercício registrado ainda</p>
                    <a href="/browse.html" class="mt-3 inline-block text-sm text-purple-600 hover:underline">Explorar exercícios →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        if (!VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }
        VClass.initNavbar('progress');
        const user = VClass.getCurrentUser();

        let mainChartInstance = null;
        let currentPeriod = 'week';
        let currentChartType = 'lessons';

        // Chart data by period & type
        const CHART_DATA = {
            week: {
                labels: ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],
                lessons: [2,3,1,4,3,5,2],
                time: [30,45,20,60,40,75,35],
                score: [72,85,68,90,78,95,80]
            },
            month: {
                labels: ['Sem 1','Sem 2','Sem 3','Sem 4'],
                lessons: [12,18,9,22],
                time: [180,270,120,330],
                score: [75,80,72,88]
            },
            all: {
                labels: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],
                lessons: [5,12,8,18,15,22,10,25,20,30,18,28],
                time: [80,180,120,270,225,330,150,375,300,450,270,420],
                score: [65,70,68,75,78,82,72,85,80,88,84,90]
            }
        };

        const CHART_CONFIG = {
            lessons: { label: 'Aulas Assistidas', color: '#7c3aed', bg: 'rgba(124,58,237,0.1)', type: 'bar' },
            time:    { label: 'Minutos Estudados', color: '#2563eb', bg: 'rgba(37,99,235,0.1)', type: 'line' },
            score:   { label: 'Pontuação (%)', color: '#16a34a', bg: 'rgba(22,163,74,0.1)', type: 'line' }
        };

        function createChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const d = CHART_DATA[currentPeriod];
            const c = CHART_CONFIG[currentChartType];
            mainChartInstance = new Chart(ctx, {
                type: c.type,
                data: {
                    labels: d.labels,
                    datasets: [{
                        label: c.label,
                        data: d[currentChartType],
                        backgroundColor: c.bg,
                        borderColor: c.color,
                        borderWidth: 2,
                        borderRadius: c.type === 'bar' ? 8 : 0,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: c.color,
                        pointRadius: c.type === 'line' ? 5 : 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function updateChart() {
            const d = CHART_DATA[currentPeriod];
            const c = CHART_CONFIG[currentChartType];
            mainChartInstance.data.labels = d.labels;
            mainChartInstance.data.datasets[0].data = d[currentChartType];
            mainChartInstance.data.datasets[0].label = c.label;
            mainChartInstance.data.datasets[0].backgroundColor = c.bg;
            mainChartInstance.data.datasets[0].borderColor = c.color;
            mainChartInstance.config.type = c.type;
            mainChartInstance.data.datasets[0].borderRadius = c.type === 'bar' ? 8 : 0;
            mainChartInstance.update();
        }

        function setPeriod(p) {
            currentPeriod = p;
            ['week','month','all'].forEach(id => {
                const btn = document.getElementById(`period-${id}`);
                btn.classList.remove('active','bg-white','text-purple-600');
                btn.classList.add('bg-white/20','text-white');
            });
            const active = document.getElementById(`period-${p}`);
            active.classList.add('active','bg-white','text-purple-600');
            active.classList.remove('bg-white/20','text-white');
            updateChart();
        }

        function switchChartType(t) {
            currentChartType = t;
            document.querySelectorAll('.chart-type-btn').forEach(btn => {
                btn.classList.remove('bg-white','shadow-sm','text-gray-900');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`ct-${t}`).classList.add('bg-white','shadow-sm','text-gray-900');
            document.getElementById(`ct-${t}`).classList.remove('text-gray-500');
            updateChart();
        }

        // Tabs
        function switchTab(name) {
            ['subjects','activity','exercises'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`tab-${t}`).classList.add('text-gray-500');
                document.getElementById(`${t}-content`).classList.add('hidden');
            });
            document.getElementById(`tab-${name}`).classList.add('active');
            document.getElementById(`tab-${name}`).classList.remove('text-gray-500');
            document.getElementById(`${name}-content`).classList.remove('hidden');
            if (name === 'activity') loadActivityTab();
            if (name === 'exercises') loadExercisesTab();
        }

        // Stats
        function renderStats(summary) {
            const completed = summary.lessons_completed || summary.completedLessons || 0;
            const total = summary.total_lessons || summary.totalLessons || 120;
            const exercises = summary.exercises_completed || summary.totalExercises || 0;
            const score = Math.round(summary.avg_score || summary.averageScore || 0);
            const time = Math.floor((summary.total_time_spent_seconds || 0) / 3600);

            document.getElementById('stats-container').innerHTML = `
                <div class="stat-card p-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 bg-purple-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-video text-purple-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5">Aulas Concluídas</p>
                            <p class="text-2xl font-bold text-gray-900" id="s-completed">0</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <div class="flex justify-between text-xs text-gray-500 mb-1">
                            <span>${completed} de ${total}</span>
                            <span>${Math.round((completed/total)*100)}%</span>
                        </div>
                        <div class="h-1.5 bg-gray-100 rounded-full">
                            <div class="h-1.5 bg-purple-600 rounded-full progress-fill" style="width:${Math.round((completed/total)*100)}%"></div>
                        </div>
                    </div>
                </div>
                <div class="stat-card p-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-tasks text-blue-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5">Exercícios Feitos</p>
                            <p class="text-2xl font-bold text-gray-900" id="s-exercises">0</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-3"><i class="fas fa-arrow-up text-green-500 mr-1"></i>+5 esta semana</p>
                </div>
                <div class="stat-card p-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 bg-green-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-star text-green-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5">Pontuação Média</p>
                            <p class="text-2xl font-bold ${score>=70?'text-green-600':'text-orange-600'}" id="s-score">0%</p>
                        </div>
                    </div>
                    <div class="mt-3 h-1.5 bg-gray-100 rounded-full">
                        <div class="h-1.5 rounded-full progress-fill ${score>=70?'bg-green-500':'bg-orange-400'}" style="width:${score}%"></div>
                    </div>
                </div>
                <div class="stat-card p-6">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 bg-orange-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-clock text-orange-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-0.5">Horas de Estudo</p>
                            <p class="text-2xl font-bold text-gray-900" id="s-time">0h</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-3"><i class="fas fa-fire text-orange-500 mr-1"></i>Sequência: 7 dias</p>
                </div>
            `;

            // Animate numbers
            setTimeout(() => {
                animCount(document.getElementById('s-completed'), completed);
                animCount(document.getElementById('s-exercises'), exercises);
                animCount(document.getElementById('s-score'), score, '%');
                animCount(document.getElementById('s-time'), time, 'h');
            }, 100);

            // Overall ring
            const pct = Math.round((completed/total)*100) || 0;
            const circ = 408.41;
            const offset = circ - (circ * pct / 100);
            document.getElementById('overall-ring').style.strokeDashoffset = offset;
            document.getElementById('overall-pct').textContent = pct + '%';
            document.getElementById('ring-completed').textContent = completed;
            document.getElementById('ring-total').textContent = total;
        }

        function animCount(el, target, suffix='') {
            if (!el) return;
            let cur = 0;
            const step = Math.max(1, Math.ceil(target/60));
            const timer = setInterval(() => {
                cur = Math.min(cur+step, target);
                el.textContent = cur + suffix;
                if (cur >= target) clearInterval(timer);
            }, 16);
        }

        // Subjects
        function renderSubjects(subjects) {
            const container = document.getElementById('subjects-container');
            if (!subjects || subjects.length === 0) {
                // Mock data
                subjects = [
                    { subject_name:'Matemática', completed_lessons:12, total_lessons:20, average_score:85, total_watch_time:3600, subject_color:'#7c3aed' },
                    { subject_name:'Física', completed_lessons:8, total_lessons:15, average_score:72, total_watch_time:2400, subject_color:'#2563eb' },
                    { subject_name:'Química', completed_lessons:5, total_lessons:18, average_score:68, total_watch_time:1800, subject_color:'#16a34a' },
                    { subject_name:'Biologia', completed_lessons:10, total_lessons:16, average_score:90, total_watch_time:3000, subject_color:'#d97706' },
                    { subject_name:'Português', completed_lessons:6, total_lessons:14, average_score:78, total_watch_time:2100, subject_color:'#dc2626' },
                    { subject_name:'História', completed_lessons:3, total_lessons:12, average_score:60, total_watch_time:900, subject_color:'#0891b2' },
                ];
            }

            container.innerHTML = subjects.map((s, i) => {
                const pct = s.progress_percent || Math.round(((s.completed_lessons||0)/(s.total_lessons||1))*100);
                const score = Math.round(s.average_score || 0);
                const color = s.subject_color || '#7c3aed';
                const mins = Math.floor((s.total_watch_time||0)/60);
                const scoreClass = score>=80?'bg-green-100 text-green-700':score>=60?'bg-yellow-100 text-yellow-700':'bg-red-100 text-red-700';

                return `
                <div class="subject-card bg-white rounded-2xl shadow-sm p-6 fade-in" style="animation-delay:${i*0.05}s">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${color}20">
                                <div class="w-4 h-4 rounded-full" style="background:${color}"></div>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900">${s.subject_name}</h3>
                                <p class="text-xs text-gray-500">${s.completed_lessons||0} / ${s.total_lessons||0} aulas</p>
                            </div>
                        </div>
                        <span class="text-2xl font-bold" style="color:${color}">${pct}%</span>
                    </div>
                    <div class="mb-4">
                        <div class="w-full bg-gray-100 rounded-full h-2.5">
                            <div class="h-2.5 rounded-full progress-fill" style="width:${pct}%; background:${color}"></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="text-center">
                                <p class="text-xs text-gray-500">Tempo</p>
                                <p class="text-sm font-semibold text-gray-900">${mins}min</p>
                            </div>
                            <div class="w-px h-8 bg-gray-200"></div>
                            <div class="text-center">
                                <p class="text-xs text-gray-500">Nota</p>
                                <span class="score-pill ${scoreClass}">${score}%</span>
                            </div>
                        </div>
                        <a href="/browse.html?subject=${encodeURIComponent(s.subject_name)}" class="text-xs font-medium text-purple-600 hover:text-purple-700">
                            Ver aulas →
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        function loadActivityTab() {
            const activities = [
                { icon:'fa-check-circle', bg:'bg-green-100', color:'text-green-600', title:'Funções Quadráticas - Lição 3', desc:'Aula concluída · Matemática', time:'2 horas atrás', score:null },
                { icon:'fa-tasks', bg:'bg-blue-100', color:'text-blue-600', title:'Quiz 2 - Álgebra Linear', desc:'Exercício concluído', time:'4 horas atrás', score:80 },
                { icon:'fa-play-circle', bg:'bg-purple-100', color:'text-purple-600', title:'Derivadas - Introdução', desc:'Vídeo assistido · 32 min', time:'Ontem', score:null },
                { icon:'fa-star', bg:'bg-yellow-100', color:'text-yellow-600', title:'Conquista: Em Chamas 🔥', desc:'7 dias de sequência consecutiva', time:'Ontem', score:null },
                { icon:'fa-check-circle', bg:'bg-green-100', color:'text-green-600', title:'Geometria Euclidiana - Lição 1', desc:'Aula concluída · Matemática', time:'2 dias atrás', score:null },
                { icon:'fa-tasks', bg:'bg-blue-100', color:'text-blue-600', title:'Exercícios - Equações', desc:'Exercício concluído', time:'3 dias atrás', score:95 },
                { icon:'fa-book', bg:'bg-indigo-100', color:'text-indigo-600', title:'Formulário de Matemática PDF', desc:'Recurso da biblioteca acessado', time:'4 dias atrás', score:null },
            ];

            document.getElementById('activity-list').innerHTML = activities.map(a => `
                <div class="flex items-center space-x-4 p-4 hover:bg-gray-50 transition">
                    <div class="w-10 h-10 ${a.bg} rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas ${a.icon} ${a.color} text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-gray-900">${a.title}</p>
                        <p class="text-xs text-gray-500">${a.desc}</p>
                    </div>
                    <div class="text-right flex-shrink-0">
                        ${a.score !== null ? `<span class="score-pill ${a.score>=70?'bg-green-100 text-green-700':'bg-orange-100 text-orange-700'} block mb-1">${a.score}%</span>` : ''}
                        <p class="text-xs text-gray-400">${a.time}</p>
                    </div>
                </div>
            `).join('');
        }

        function loadExercisesTab() {
            const exercises = [
                { title:'Quiz 1 - Funções', subject:'Matemática', score:100, date:'Ontem', questions:10, correct:10 },
                { title:'Quiz 2 - Álgebra Linear', subject:'Matemática', score:80, date:'4 dias atrás', questions:10, correct:8 },
                { title:'Quiz - Leis de Newton', subject:'Física', score:72, date:'1 semana atrás', questions:10, correct:7 },
                { title:'Exercícios - Tabela Periódica', subject:'Química', score:60, date:'2 semanas atrás', questions:10, correct:6 },
            ];

            document.getElementById('exercises-list').innerHTML = exercises.map(e => {
                const scoreClass = e.score>=80?'text-green-600 bg-green-50':e.score>=60?'text-yellow-600 bg-yellow-50':'text-red-600 bg-red-50';
                return `
                <div class="bg-white rounded-2xl shadow-sm p-5">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <h4 class="font-bold text-gray-900">${e.title}</h4>
                            <p class="text-xs text-gray-500 mt-0.5">${e.subject} · ${e.date}</p>
                        </div>
                        <span class="text-2xl font-bold ${e.score>=80?'text-green-600':e.score>=60?'text-yellow-600':'text-red-600'}">${e.score}%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full mb-3">
                        <div class="h-2 rounded-full ${e.score>=80?'bg-green-500':e.score>=60?'bg-yellow-500':'bg-red-500'} progress-fill" style="width:${e.score}%"></div>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span>${e.correct}/${e.questions} respostas corretas</span>
                        <span class="score-pill ${scoreClass}">${e.score>=80?'😊 Ótimo':e.score>=60?'🆗 Regular':'😕 Estudar mais'}</span>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadProgress() {
            try {
                const result = await VClass.api.progress.getDashboard();
                if (result.success) {
                    const { summary, subjectProgress } = result.data;
                    renderStats(summary || {});
                    renderSubjects(subjectProgress);
                } else {
                    renderStats({});
                    renderSubjects([]);
                }
            } catch(e) {
                console.error(e);
                renderStats({});
                renderSubjects([]);
            }
        }

        // Init
        createChart();
        loadProgress();
        setTab('subjects');
    </script>
</body>
</html>
