<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .book-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
        }
        .book-cover {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .book-cover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .book-card:hover .book-cover::after {
            opacity: 1;
        }
        .book-actions {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .book-card:hover .book-actions {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .category-tab {
            transition: all 0.3s ease;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }
        .featured-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            z-index: 10;
        }
        .star-rating {
            color: #fbbf24;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </a>
                    <div class="hidden md:flex space-x-4">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-video mr-1"></i> Aulas
                        </a>
                        <a href="/library.html" class="px-3 py-2 rounded-md text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-book mr-1"></i> Biblioteca
                        </a>
                        <a href="/progress.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/profile.html" class="px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-user mr-1"></i> <span id="user-name"></span>
                    </a>
                    <button onclick="VClass.logout()" class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-sign-out-alt mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">
                <i class="fas fa-book-open text-purple-600 mr-3"></i>
                Biblioteca Digital
            </h1>
            <p class="text-lg text-gray-600">Livros, apostilas e materiais de estudo em PDF</p>
        </div>

        <!-- Search Bar -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Buscar por título, autor ou disciplina..." 
                            class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                            onkeyup="searchBooks()"
                        >
                    </div>
                </div>
                <div class="flex gap-3">
                    <select id="subject-filter" class="px-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500" onchange="filterBooks()">
                        <option value="">Todas as Disciplinas</option>
                        <option value="Matemática">Matemática</option>
                        <option value="Português">Português</option>
                        <option value="Física">Física</option>
                        <option value="Química">Química</option>
                        <option value="Biologia">Biologia</option>
                        <option value="História">História</option>
                        <option value="Geografia">Geografia</option>
                        <option value="Inglês">Inglês</option>
                    </select>
                    <select id="grade-filter" class="px-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500" onchange="filterBooks()">
                        <option value="">Todas as Classes</option>
                        <option value="10">10ª Classe</option>
                        <option value="11">11ª Classe</option>
                        <option value="12">12ª Classe</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Total de Livros</p>
                        <p id="stat-books" class="text-3xl font-bold text-gray-900">124</p>
                    </div>
                    <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-book text-blue-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Apostilas</p>
                        <p id="stat-handouts" class="text-3xl font-bold text-gray-900">68</p>
                    </div>
                    <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-pdf text-green-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Exercícios</p>
                        <p id="stat-exercises" class="text-3xl font-bold text-gray-900">89</p>
                    </div>
                    <div class="w-14 h-14 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-tasks text-purple-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Downloads</p>
                        <p id="stat-downloads" class="text-3xl font-bold text-gray-900">1.2k</p>
                    </div>
                    <div class="w-14 h-14 bg-orange-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-download text-orange-600 text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Categories Tabs -->
        <div class="mb-8">
            <div class="bg-white rounded-xl shadow-sm p-2">
                <div class="flex flex-wrap gap-2">
                    <button onclick="showCategory('all')" class="category-tab active flex-1 min-w-[120px] px-6 py-3 rounded-lg font-medium text-gray-700">
                        <i class="fas fa-th-large mr-2"></i>Todos
                    </button>
                    <button onclick="showCategory('books')" class="category-tab flex-1 min-w-[120px] px-6 py-3 rounded-lg font-medium text-gray-700">
                        <i class="fas fa-book mr-2"></i>Livros
                    </button>
                    <button onclick="showCategory('handouts')" class="category-tab flex-1 min-w-[120px] px-6 py-3 rounded-lg font-medium text-gray-700">
                        <i class="fas fa-file-pdf mr-2"></i>Apostilas
                    </button>
                    <button onclick="showCategory('exercises')" class="category-tab flex-1 min-w-[120px] px-6 py-3 rounded-lg font-medium text-gray-700">
                        <i class="fas fa-tasks mr-2"></i>Exercícios
                    </button>
                </div>
            </div>
        </div>

        <!-- Featured Books Section -->
        <div id="featured-section" class="mb-12">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-900">
                    <i class="fas fa-star text-yellow-500 mr-2"></i>Livros em Destaque
                </h2>
            </div>
            <div id="featured-books" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- All Books Section -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Todos os Materiais</h2>
                <span id="books-count" class="text-gray-600"></span>
            </div>
        </div>

        <!-- Books Grid -->
        <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8">
            <!-- Populated by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16 hidden">
            <i class="fas fa-search text-7xl text-gray-300 mb-4"></i>
            <p class="text-2xl text-gray-600 mb-2">Nenhum material encontrado</p>
            <p class="text-gray-500">Tente ajustar os filtros de busca</p>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/library-data.js"></script>
    <script>
        // Check authentication
        if (!VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = VClass.getCurrentUser();
        if (user) {
            document.getElementById('user-name').textContent = user.full_name || user.name;
        }

        // Global state
        let currentCategory = 'all';
        let allBooks = [];

        // Initialize library
        function init() {
            allBooks = VClassLibrary.getAllBooks();
            
            // Update stats
            const stats = VClassLibrary.stats;
            document.getElementById('stat-books').textContent = stats.totalBooks;
            document.getElementById('stat-handouts').textContent = stats.totalHandouts;
            document.getElementById('stat-exercises').textContent = stats.totalExercises;
            document.getElementById('stat-downloads').textContent = formatNumber(stats.totalDownloads);
            
            // Render featured books
            renderFeaturedBooks();
            
            // Render all books
            renderBooks(allBooks);
        }

        function renderFeaturedBooks() {
            const container = document.getElementById('featured-books');
            const featured = VClassLibrary.featured;

            container.innerHTML = featured.map(book => createFeaturedBookCard(book)).join('');
        }

        function createFeaturedBookCard(book) {
            return `
                <div class="book-card bg-white rounded-xl shadow-md overflow-hidden" onclick="viewBook(${book.id})">
                    <div class="relative">
                        <div class="book-cover h-80 bg-gradient-to-br from-purple-100 to-purple-50 flex items-center justify-center">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover">
                            <div class="book-actions flex gap-2">
                                <button class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-600 hover:text-white transition">
                                    <i class="fas fa-eye mr-2"></i>Visualizar
                                </button>
                                <button class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-600 hover:text-white transition">
                                    <i class="fas fa-download mr-2"></i>Baixar
                                </button>
                            </div>
                        </div>
                        <div class="featured-badge">
                            <span class="px-3 py-1 bg-yellow-500 text-white text-xs font-bold rounded-full shadow-lg">
                                <i class="fas fa-star mr-1"></i>DESTAQUE
                            </span>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-2">
                            <span class="px-3 py-1 bg-purple-100 text-purple-700 text-xs font-semibold rounded-full">
                                ${book.subject}
                            </span>
                            <div class="star-rating">
                                ${renderStars(book.rating)}
                            </div>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2 line-clamp-1">${book.title}</h3>
                        <p class="text-sm text-gray-600 mb-3">${book.author}</p>
                        <p class="text-sm text-gray-500 mb-4 line-clamp-2">${book.description}</p>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span><i class="fas fa-file-alt mr-1"></i>${book.pages} páginas</span>
                            <span><i class="fas fa-download mr-1"></i>${formatNumber(book.downloads)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBooks(books) {
            const container = document.getElementById('books-grid');
            const emptyState = document.getElementById('empty-state');
            const nonFeatured = books.filter(b => !b.isFeatured);

            if (nonFeatured.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                container.classList.remove('hidden');
                emptyState.classList.add('hidden');
                container.innerHTML = nonFeatured.map(book => createBookCard(book)).join('');
            }

            document.getElementById('books-count').textContent = `${nonFeatured.length} materiais`;
        }

        function createBookCard(book) {
            return `
                <div class="book-card bg-white rounded-xl shadow-md overflow-hidden" onclick="viewBook(${book.id})">
                    <div class="relative">
                        <div class="book-cover h-64 bg-gradient-to-br from-gray-100 to-gray-50 flex items-center justify-center">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover">
                            <div class="book-actions flex gap-2">
                                <button class="px-3 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-600 hover:text-white transition text-sm">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="px-3 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-600 hover:text-white transition text-sm">
                                    <i class="fas fa-download"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="px-2 py-1 bg-purple-100 text-purple-700 text-xs font-semibold rounded">
                                ${book.subject}
                            </span>
                            <span class="text-xs text-gray-500">${book.grade}ª Classe</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-1 line-clamp-1">${book.title}</h3>
                        <p class="text-xs text-gray-600 mb-2">${book.author}</p>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span><i class="fas fa-file-alt mr-1"></i>${book.pages}p</span>
                            <div class="star-rating text-xs">
                                ${renderStars(book.rating)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let html = '';
            
            for (let i = 0; i < fullStars; i++) {
                html += '<i class="fas fa-star"></i>';
            }
            if (hasHalf) {
                html += '<i class="fas fa-star-half-alt"></i>';
            }
            
            return html;
        }

        function showCategory(category) {
            currentCategory = category;
            
            // Update tab styles
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.category-tab').classList.add('active');
            
            // Show/hide featured section
            if (category === 'all') {
                document.getElementById('featured-section').style.display = 'block';
            } else {
                document.getElementById('featured-section').style.display = 'none';
            }
            
            // Filter books
            filterBooks();
        }

        function filterBooks() {
            let filtered = VClassLibrary.getBooksByCategory(currentCategory);
            
            const subject = document.getElementById('subject-filter').value;
            if (subject) {
                filtered = filtered.filter(book => book.subject === subject);
            }
            
            const grade = document.getElementById('grade-filter').value;
            if (grade) {
                filtered = filtered.filter(book => book.grade === parseInt(grade));
            }
            
            renderBooks(filtered);
        }

        function searchBooks() {
            const query = document.getElementById('search-input').value;
            
            if (query.trim() === '') {
                filterBooks();
                return;
            }
            
            const results = VClassLibrary.searchBooks(query);
            renderBooks(results);
        }

        function viewBook(id) {
            const book = VClassLibrary.getBookById(id);
            if (book) {
                alert(`Visualizando: ${book.title}\n\nEsta funcionalidade será implementada em breve com visualizador de PDF integrado.`);
            }
        }

        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        // Initialize
        init();
    </script>
</body>
</html>
