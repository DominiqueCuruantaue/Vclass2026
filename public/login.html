<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo -->
            <div class="text-center">
                <div class="flex items-center justify-center space-x-2 mb-4">
                    <i class="fas fa-graduation-cap text-5xl text-purple-600"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-gray-900">
                    VClass
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Entre na sua conta para continuar aprendendo
                </p>
            </div>

            <!-- Alert Container -->
            <div id="alert-container"></div>

            <!-- Login Form -->
            <form id="login-form" class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow-md">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">
                            Email
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input 
                                id="email" 
                                name="email" 
                                type="email" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="seu@email.com"
                                value="estudante@vclass.mz"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Senha
                        </label>
                        <div class="mt-1 relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input 
                                id="password" 
                                name="password" 
                                type="password" 
                                required 
                                class="appearance-none block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                placeholder="••••••••"
                                value="password123"
                            >
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember-me" 
                            name="remember-me" 
                            type="checkbox" 
                            class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
                        >
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Lembrar de mim
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-purple-600 hover:text-purple-500">
                            Esqueceu a senha?
                        </a>
                    </div>
                </div>

                <div>
                    <button 
                        type="submit" 
                        id="login-btn"
                        class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Entrar
                    </button>
                </div>

                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        Não tem uma conta?
                        <a href="/register.html" class="font-medium text-purple-600 hover:text-purple-500">
                            Registar agora
                        </a>
                    </p>
                </div>
            </form>

            <!-- Test Users Info -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <h3 class="text-sm font-semibold text-blue-900 mb-2">
                    <i class="fas fa-info-circle mr-1"></i>
                    Usuários de Teste
                </h3>
                <div class="text-xs text-blue-800 space-y-1">
                    <p><strong>Estudante:</strong> estudante@vclass.mz / password123</p>
                    <p><strong>Professor:</strong> professor@vclass.mz / password123</p>
                    <p><strong>Admin:</strong> admin@vclass.mz / password123</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const alertContainer = document.getElementById('alert-container');

        // Show alert
        function showAlert(message, type = 'error') {
            const colors = {
                error: 'bg-red-50 border-red-200 text-red-800',
                success: 'bg-green-50 border-green-200 text-green-800',
                info: 'bg-blue-50 border-blue-200 text-blue-800'
            };

            alertContainer.innerHTML = `
                <div class="${colors[type]} border rounded-lg p-4 mb-4 fade-in">
                    <div class="flex items-center">
                        <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'} mr-2"></i>
                        <span>${message}</span>
                    </div>
                </div>
            `;

            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Handle login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Entrando...';

            try {
                const result = await VClass.api.auth.login(email, password);

                if (result.success) {
                    // Save auth data
                    VClass.saveAuth(result.data);

                    // Show success
                    showAlert('Login realizado com sucesso!', 'success');

                    // Redirect based on role
                    setTimeout(() => {
                        if (result.data.user.role === 'student') {
                            window.location.href = '/dashboard.html';
                        } else if (result.data.user.role === 'teacher') {
                            window.location.href = '/teacher-dashboard.html';
                        } else if (result.data.user.role === 'admin') {
                            window.location.href = '/admin-dashboard.html';
                        }
                    }, 1000);
                } else {
                    showAlert(result.error || 'Erro ao fazer login. Verifique suas credenciais.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Entrar';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Erro de conexão. Verifique sua internet.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Entrar';
            }
        });

        // Check if already logged in
        if (VClass.isAuthenticated()) {
            const user = VClass.getCurrentUser();
            if (user) {
                if (user.role === 'student') {
                    window.location.href = '/dashboard.html';
                } else if (user.role === 'teacher') {
                    window.location.href = '/teacher-dashboard.html';
                } else if (user.role === 'admin') {
                    window.location.href = '/admin-dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
