<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulos - VClass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-graduation-cap text-2xl text-purple-600"></i>
                        <span class="text-xl font-bold text-gray-900">VClass</span>
                    </div>
                    <div class="hidden md:flex space-x-4">
                        <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </a>
                        <a href="/browse.html" class="px-3 py-2 rounded-md text-sm font-medium text-purple-600 bg-purple-50">
                            <i class="fas fa-book mr-1"></i> Conteúdo
                        </a>
                        <a href="/my-progress.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                            <i class="fas fa-chart-line mr-1"></i> Progresso
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-sm text-gray-700"></span>
                    <button onclick="VClass.logout()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-md">
                        <i class="fas fa-sign-out-alt mr-1"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Breadcrumb -->
        <nav class="flex mb-6" aria-label="Breadcrumb">
            <ol id="breadcrumb" class="inline-flex items-center space-x-1 md:space-x-3">
                <!-- Will be populated by JS -->
            </ol>
        </nav>

        <!-- Subject Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div id="subject-icon" class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-book text-purple-600 text-2xl"></i>
                    </div>
                    <div>
                        <h1 id="subject-name" class="text-3xl font-bold text-gray-900 mb-1">Carregando...</h1>
                        <p id="subject-info" class="text-gray-600">Carregando informações...</p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-600 mb-1">Seu Progresso</div>
                    <div class="flex items-center space-x-2">
                        <div class="w-32 bg-gray-200 rounded-full h-3">
                            <div id="progress-bar" class="bg-purple-600 h-3 rounded-full" style="width: 0%"></div>
                        </div>
                        <span id="progress-text" class="text-lg font-bold text-purple-600">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chapters List -->
        <div id="chapters-container" class="space-y-6">
            <!-- Loading -->
            <div class="bg-white rounded-lg shadow-md p-6 animate-pulse">
                <div class="h-6 bg-gray-200 rounded w-1/3 mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6 animate-pulse">
                <div class="h-6 bg-gray-200 rounded w-1/3 mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="mt-8">
            <a href="/browse.html" class="inline-flex items-center px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                <i class="fas fa-arrow-left mr-2"></i> Voltar para Conteúdo
            </a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // Check authentication
        if (!VClass.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const user = VClass.getCurrentUser();
        if (user) {
            document.getElementById('user-name').textContent = user.full_name;
        }

        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const gradeSubjectId = params.get('gs');
        const subjectName = params.get('subject');
        const gradeName = params.get('grade');
        const countryName = params.get('country');

        // Check if parameters exist
        if (!gradeSubjectId || !subjectName) {
            window.location.href = '/browse.html';
        }

        // Update UI with subject info
        document.getElementById('subject-name').textContent = subjectName;
        document.getElementById('subject-info').textContent = `${gradeName} • ${countryName}`;

        // Update breadcrumb
        const breadcrumb = document.getElementById('breadcrumb');
        breadcrumb.innerHTML = `
            <li class="inline-flex items-center">
                <a href="/browse.html" class="text-gray-700 hover:text-purple-600">
                    <i class="fas fa-home mr-1"></i> Início
                </a>
            </li>
            <li>
                <div class="flex items-center">
                    <i class="fas fa-chevron-right text-gray-400 mx-2"></i>
                    <span class="text-gray-700">${countryName}</span>
                </div>
            </li>
            <li>
                <div class="flex items-center">
                    <i class="fas fa-chevron-right text-gray-400 mx-2"></i>
                    <span class="text-gray-700">${gradeName}</span>
                </div>
            </li>
            <li>
                <div class="flex items-center">
                    <i class="fas fa-chevron-right text-gray-400 mx-2"></i>
                    <span class="text-purple-600 font-semibold">${subjectName}</span>
                </div>
            </li>
        `;

        // Load chapters and lessons
        async function loadChapters() {
            try {
                const result = await VClass.api.content.getChapters(gradeSubjectId);

                if (result.success && result.data.length > 0) {
                    // Load lessons for each chapter
                    const chaptersWithLessons = await Promise.all(
                        result.data.map(async chapter => {
                            const lessonsResult = await VClass.api.content.getLessons(chapter.id);
                            return {
                                ...chapter,
                                lessons: lessonsResult.success ? lessonsResult.data : []
                            };
                        })
                    );

                    renderChapters(chaptersWithLessons);

                    // Load progress
                    loadProgress(gradeSubjectId);
                } else {
                    showNoContent();
                }
            } catch (error) {
                console.error('Error loading chapters:', error);
                showError();
            }
        }

        function renderChapters(chapters) {
            const container = document.getElementById('chapters-container');

            container.innerHTML = chapters.map((chapter, index) => `
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <!-- Chapter Header -->
                    <div class="bg-gradient-to-r from-purple-600 to-purple-700 p-6 text-white">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                                    <span class="text-xl font-bold">${index + 1}</span>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-bold">${chapter.title}</h2>
                                    <p class="text-purple-100 text-sm">${chapter.description || ''}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-purple-100">Lições</div>
                                <div class="text-2xl font-bold">${chapter.lessons.length}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Lessons List -->
                    <div class="divide-y divide-gray-200">
                        ${chapter.lessons.length > 0 ? chapter.lessons.map((lesson, lIndex) => `
                            <a href="/lesson.html?id=${lesson.id}&chapter=${encodeURIComponent(chapter.title)}&subject=${encodeURIComponent(subjectName)}&grade=${encodeURIComponent(gradeName)}&country=${encodeURIComponent(countryName)}" 
                               class="block p-6 hover:bg-purple-50 transition group">
                                <div class="flex items-center space-x-4">
                                    <div class="flex-shrink-0">
                                        <div class="w-16 h-16 bg-gray-200 rounded-lg overflow-hidden">
                                            <img src="${lesson.thumbnail_url || 'https://via.placeholder.com/64'}" 
                                                 alt="${lesson.title}"
                                                 class="w-full h-full object-cover">
                                        </div>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center space-x-2 mb-1">
                                            <span class="text-sm text-gray-500">Lição ${lIndex + 1}</span>
                                            ${lesson.is_free ? '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded">GRÁTIS</span>' : ''}
                                            ${lesson.video_duration ? `<span class="text-xs text-gray-500"><i class="fas fa-clock mr-1"></i>${Math.floor(lesson.video_duration / 60)}min</span>` : ''}
                                        </div>
                                        <h3 class="text-lg font-semibold text-gray-900 group-hover:text-purple-600 transition">
                                            ${lesson.title}
                                        </h3>
                                        <p class="text-sm text-gray-600 mt-1 line-clamp-2">${lesson.description || ''}</p>
                                    </div>
                                    <div class="flex-shrink-0">
                                        <i class="fas fa-play-circle text-3xl text-purple-600 group-hover:text-purple-700 transition"></i>
                                    </div>
                                </div>
                            </a>
                        `).join('') : `
                            <div class="p-6 text-center text-gray-500">
                                <i class="fas fa-inbox text-3xl mb-2"></i>
                                <p>Nenhuma lição disponível ainda</p>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function loadProgress(gradeSubjectId) {
            try {
                const result = await VClass.api.progress.getSubjectProgress(gradeSubjectId);

                if (result.success && result.data.summary) {
                    const progress = result.data.summary.overallProgress || 0;
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                    document.getElementById('progress-text').textContent = `${progress}%`;
                }
            } catch (error) {
                console.error('Error loading progress:', error);
            }
        }

        function showNoContent() {
            const container = document.getElementById('chapters-container');
            container.innerHTML = `
                <div class="bg-white rounded-lg shadow-md p-12 text-center">
                    <i class="fas fa-folder-open text-6xl text-gray-300 mb-4"></i>
                    <h2 class="text-2xl font-bold text-gray-700 mb-2">Nenhum conteúdo disponível</h2>
                    <p class="text-gray-600 mb-6">Esta disciplina ainda não possui capítulos ou lições.</p>
                    <a href="/browse.html" class="inline-flex items-center px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-arrow-left mr-2"></i> Explorar Outras Disciplinas
                    </a>
                </div>
            `;
        }

        function showError() {
            const container = document.getElementById('chapters-container');
            container.innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
                    <i class="fas fa-exclamation-triangle text-3xl text-red-600 mb-2"></i>
                    <p class="text-red-800">Erro ao carregar conteúdo. Tente novamente.</p>
                </div>
            `;
        }

        // Load data
        loadChapters();
    </script>
</body>
</html>
